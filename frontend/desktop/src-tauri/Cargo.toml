[package]
name = "xinyi-relay-desktop"
version = "0.2.1"
edition = "2024"
rust-version = "1.97.1"

[build-dependencies]
tauri-build = { version = "2.1.1", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
keyring = "4"
keyring-core = "1"
reqwest = { version = "0.13.0", default-features = false, features = ["json", "native-tls", "blocking"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"
serde_json = "1.0.145"
sha2 = "0.11"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.1"
tokio = { version = "1.48.0", features = ["time", "net", "macros", "rt"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
local-ip-address = "0.6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
