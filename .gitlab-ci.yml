# Mirrors the GitLab-owned release to GitHub (tag, notes, release APKs).
# Inert unless GITHUB_RELEASE_TOKEN is configured for the project.
android:release:github:
  extends: .magisk_android_release_github
  resource_group: xinyi-android-release-publish
  stage: release-publish
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  variables:
    # Must stay job-level: the toolkit template pins the same key at job level
    # to "*arm64-v8a*.apk", and job variables outrank the global variables
    # block, so a global override here would be silently ignored.
    MAGISK_ANDROID_RELEASE_GITHUB_ASSET_PATTERN: "*.apk"
  needs:
    - job: android:release:github-apk
      artifacts: true
    # gh release create would otherwise invent the tag at the GitHub default
    # branch HEAD while the mirror has not published it yet.
    - job: sync:github

# Keeps the public GitHub mirror in step with GitLab. GITHUB_PAT is a
# group-level protected variable, so it is only injected on protected branches;
# tag pipelines fall back to the project-level GITHUB_RELEASE_TOKEN.
sync:github:
  stage: sync
  needs:
    - job: android:release:guard
      optional: true
  image: alpine:latest
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -euo pipefail
      sync_token="${GITHUB_PAT:-${GITHUB_RELEASE_TOKEN:-}}"
      if [ -z "$sync_token" ]; then
        echo "ERROR: neither GITHUB_PAT nor GITHUB_RELEASE_TOKEN is available on $CI_COMMIT_REF_NAME" >&2
        exit 1
      fi
      git remote add github "https://magisk317:${sync_token}@github.com/magisk317/${CI_PROJECT_NAME}.git" || true
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push github "$CI_COMMIT_TAG" --force
        git push github --tags --force
      else
        git push github "HEAD:refs/heads/$CI_COMMIT_BRANCH" --force
      fi
