include:
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: "f2ad0313cbf0bb12e551c94a80bdd0063dcc0411"
    file: /.gitlab/ci/android.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: "f2ad0313cbf0bb12e551c94a80bdd0063dcc0411"
    file: /.gitlab/ci/android-release.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: "f2ad0313cbf0bb12e551c94a80bdd0063dcc0411"
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: "f2ad0313cbf0bb12e551c94a80bdd0063dcc0411"
    file: /.gitlab/ci/renovate.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: "f2ad0313cbf0bb12e551c94a80bdd0063dcc0411"
    file: /.gitlab/ci/cancel-mr-pipelines.yml
  # Utility-job anchor (alpine, pinned): the GitHub mirror and the README-badge
  # job extend it instead of pinning their own image. Language-tool jobs
  # (backend:go, webui:check, the docker/node jobs) keep their own pinned tool
  # images by design.
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: "f2ad0313cbf0bb12e551c94a80bdd0063dcc0411"
    file: /.gitlab/ci/utility.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: "f2ad0313cbf0bb12e551c94a80bdd0063dcc0411"
    file: /.gitlab/ci/github-sync.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: "f2ad0313cbf0bb12e551c94a80bdd0063dcc0411"
    file: /.gitlab/ci/readme-badges.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - $XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG

stages:
  - build
  - release
  - quality
  - maintenance

variables:
  MAGISK_CI_TOOLKIT_REPOSITORY: "https://gitlab.com/magisk3171/shared/magisk-ci-toolkit.git"
  MAGISK_CI_TOOLKIT_REF: "f2ad0313cbf0bb12e551c94a80bdd0063dcc0411"
  MAGISK_CANCEL_OLDER_MR_PIPELINES: "true"
  # Cancel the merged MR's own merge_request_event pipeline from the push
  # pipeline that lands the merge. GitLab has no cancel-on-merge hook and
  # native auto_cancel never fires on a ref that receives no new pipeline,
  # so the MR pipeline would otherwise run the quality stage on merged code.
  MAGISK_CANCEL_MERGED_MR_PIPELINES: "true"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "0"
  MAGISK_ANDROID_SDKMANAGER_CHANNEL: "3"
  MAGISK_ANDROID_COMPILE_SDK: "37.2"
  MAGISK_ANDROID_COMPILE_SDK_PACKAGE: "platforms;android-37.2"
  MAGISK_ANDROID_SDK_PACKAGES: "platform-tools build-tools;37.0.0"
  MAGISK_GRADLE_ARGS: "--warning-mode all"
  MAGISK_ANDROID_RELEASE_PACKAGE_NAME: "io.github.magisk317.xinyi.relay"
  MAGISK_ANDROID_RELEASE_PLAY_URL: "https://play.google.com/store/apps/details?id=io.github.magisk317.xinyi.relay"
  MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY: "magisk317/xinyi-relay"
  MAGISK_ANDROID_RELEASE_MODULES_REPO: "Xposed-Modules-Repo/io.github.magisk317.xinyi.relay"
  MAGISK_ANDROID_RELEASE_PUBLISH_PLAY: "true"
  # Public SHA-256 fingerprint of the production APK signing certificate.
  MAGISK_ANDROID_RELEASE_CERT_SHA256: "027b936e1d82a606d83599548b8b11e49a2c8ae2588c4a9fbe8311e2c54f103a"
  # Floor for the derived Play versionCode. Must stay at (or above) the highest
  # versionCode already live on Play so that, when the Play API cannot be queried,
  # resolve_play_release.sh never derives a code Play would reject as a downgrade.
  MAGISK_PLAY_INITIAL_VERSION_CODE: "46"
  MAGISK_RENOVATE_REPOSITORY: "magisk3171/xinyi-relay"
  XINYI_DOCKERHUB_PUBLISH: "true"
  XINYI_BACKEND_ARCHES: "amd64 arm64"
  XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG: "magisk-amd64-linux"
  XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG: "magisk-arm64-linux"
  # All Android jobs (test/build/bundle/publish) read this tag, which both the
  # arm64 and the Debian ct101 amd64 group runners carry. GitLab picks
  # whichever is free (or the only one left standing), so the release chain
  # runs on different machines, pipelines overlap, and neither runner is a
  # single point of failure for producing a build.
  XINYI_ANDROID_TEST_RUNNER_TAG: "ci-android"
  XINYI_BUILD_RUNNER_TAG: "ci-android"
  XINYI_BUNDLE_RUNNER_TAG: "ci-android"

.xinyi_ci_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - when: never

.xinyi_android_rules:
  extends: .xinyi_ci_rules
  cache: []

.xinyi_signed_android_rules:
  cache: []
  rules:
    - if: '$RELEASE_KEYSTORE == "" || $STORE_PASSWORD == "" || $KEY_ALIAS == "" || $KEY_PASSWORD == ""'
      when: never
    - !reference [.xinyi_ci_rules, rules]

.xinyi_backend_validation_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - !reference [.xinyi_ci_rules, rules]

.xinyi_backend_publish_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

.xinyi_package_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

.xinyi_docker:
  image: "docker:29-cli"
  services:
    - name: "docker:29-dind"
      command: ["--tls=false", "--mtu=1400"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    HTTP_PROXY: "$CI_HTTP_PROXY"
    HTTPS_PROXY: "$CI_HTTPS_PROXY"
    http_proxy: "$CI_HTTP_PROXY"
    https_proxy: "$CI_HTTPS_PROXY"
    NO_PROXY: "$CI_NO_PROXY"
    no_proxy: "$CI_NO_PROXY"
  before_script:
    - |
      use_mirror="${MAGISK_LINUX_USE_MIRROR:-true}"
      if [ "$use_mirror" = "true" ]; then
        sed -i 's#https://dl-cdn.alpinelinux.org/alpine#https://mirrors.tuna.tsinghua.edu.cn/alpine#g' /etc/apk/repositories 2>/dev/null || true
      fi
      if ! apk add --no-cache bash curl git jq; then
        echo "Alpine package source failed, falling back to official" >&2
        sed -i 's#https://mirrors.tuna.tsinghua.edu.cn/alpine#https://dl-cdn.alpinelinux.org/alpine#g' /etc/apk/repositories 2>/dev/null || true
        apk add --no-cache bash curl git jq
      fi
    - |
      set -euo pipefail
      if [ -n "${HTTP_PROXY:-${http_proxy:-}}" ] || [ -n "${HTTPS_PROXY:-${https_proxy:-}}" ]; then
        mkdir -p "$HOME/.docker"
        cat > "$HOME/.docker/config.json" <<EOF
      {
        "proxies": {
          "default": {
            "httpProxy": "${HTTP_PROXY:-${http_proxy:-}}",
            "httpsProxy": "${HTTPS_PROXY:-${https_proxy:-}}",
            "noProxy": "${NO_PROXY:-${no_proxy:-}}"
          }
        }
      }
      EOF
      fi
    - docker version
    - docker buildx version

# KMP desktop track. The desktop modules are pure JVM, so these jobs need a JDK
# and nothing else: no Android SDK, no Node, no Rust. .magisk_android_base is the
# only anchor that stages a JDK on these runners, and it drags the SDK and the
# aapt2 workarounds along with it, so these jobs take the JDK straight from the
# image instead: no staging script, no lock file, no download.
#
# Linux x64 and arm64 only for now: those are the two runners whose packaging has
# actually been exercised. Windows and macOS jobs are deliberately not wired; see
# docs/DESKTOP.md section 4.
.xinyi_desktop_kmp_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # The desktop package is an optional extra of a release, not a gate on it:
    # the release cadence is the Android app's, and a desktop packaging failure
    # must never hold that back. Flip the first tag rule off (or set
    # XINYI_DESKTOP_REQUIRED=true and invert the condition) when the desktop
    # build becomes a required part of a release.
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

.xinyi_desktop_kmp_base:
  extends: .xinyi_desktop_kmp_rules
  stage: build
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.warning.mode=all -Dorg.gradle.workers.max=1 -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=512m'"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - desktop-artifacts/

.xinyi_desktop_kmp_linux:
  extends: .xinyi_desktop_kmp_base
  # Pure-JVM track: the JDK comes from the image (JAVA_HOME=/opt/java/openjdk,
  # jpackage and jlink included). Keep "-resolute" so the OS base stays Ubuntu
  # 26.04 and "_<build>" so the two runners cannot drift -- they pull
  # if-not-present. See "CI Java Runtime" in AGENTS.md for the fallback recipe.
  image: "eclipse-temurin:27_35-jdk-resolute"
  before_script:
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      use_mirror="${MAGISK_LINUX_USE_MIRROR:-true}"
      if [[ "$use_mirror" == "true" ]]; then
        sed -i \
          -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
          -e 's#http://archive.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          -e 's#http://security.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
        if ! apt-get -o APT::Update::Error-Mode=any update; then
          echo "Mirror apt-get update failed, falling back to official sources" >&2
          sed -i \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian-security#http://deb.debian.org/debian-security#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian#http://deb.debian.org/debian#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt-get -o APT::Update::Error-Mode=any update
        fi
      else
        apt-get -o APT::Update::Error-Mode=any update
      fi
      apt-get install -y --no-install-recommends git dpkg fakeroot
      rm -rf /var/lib/apt/lists/*
    - chmod +x scripts/ci/gitlab_desktop_kmp_package.sh

backend:go:
  extends: .xinyi_backend_validation_rules
  image: "golang:1.27.3-bookworm"
  stage: build
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs: []
  # Restates .xinyi_backend_validation_rules (job-level rules replace the
  # inherited ones) and gates the MR/branch cases on backend/** changes, so
  # Android- or frontend-only MRs no longer queue a Go job on the shared
  # arm64 runner. Release tag pipelines stay ungated (first rule).
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/**/*
    - when: never
  script:
    - |
      set -euo pipefail
      if [[ "${MAGISK_LINUX_USE_MIRROR:-true}" == "true" ]]; then
        export GOPROXY="${GOPROXY:-https://goproxy.cn,direct}"
      else
        export GOPROXY="https://proxy.golang.org,direct"
      fi
      cd backend/api
      test -z "$(gofmt -l .)"
      mkdir -p webui_dist
      touch webui_dist/.gitkeep
      go test ./...
      go build ./...

backend:smoke:
  extends:
    - .xinyi_docker
    - .xinyi_backend_validation_rules
  stage: quality
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  variables:
    BASE_URL: "http://docker:8088"
  needs:
    - job: backend:go
      artifacts: false
  # Same restatement as backend:go: tag pipelines ungated, MR/branch gated on
  # backend/** changes.
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/**/*
    - when: never
  script:
    - |
      set -euo pipefail
      docker compose version
      cp backend/.env.example backend/.env
      docker compose -f backend/docker-compose.yml config
      rm -f backend/.env
      chmod +x backend/scripts/smoke_local.sh
      backend/scripts/smoke_local.sh

backend:container:amd64:
  extends:
    - .xinyi_docker
    - .xinyi_backend_publish_rules
  resource_group: xinyi-backend-docker-amd64
  stage: build
  allow_failure: true
  tags:
    - $XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG
  needs:
    - job: backend:go
      artifacts: false
  script:
    - chmod +x scripts/ci/gitlab_backend_container.sh
    - scripts/ci/gitlab_backend_container.sh build-arch amd64

backend:container:arm64:
  extends:
    - .xinyi_docker
    - .xinyi_backend_publish_rules
  resource_group: xinyi-backend-docker-arm64
  stage: build
  allow_failure: true
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: backend:go
      artifacts: false
  script:
    - chmod +x scripts/ci/gitlab_backend_container.sh
    - scripts/ci/gitlab_backend_container.sh build-arch arm64

backend:container:manifest:
  extends:
    - .xinyi_docker
    - .xinyi_backend_publish_rules
  resource_group: xinyi-backend-docker-manifest
  stage: release
  allow_failure: true
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: backend:container:amd64
      artifacts: false
    - job: backend:container:arm64
      artifacts: false
  script:
    - chmod +x scripts/ci/gitlab_backend_container.sh
    - scripts/ci/gitlab_backend_container.sh publish-manifests
    - |
      set -euo pipefail
      export MAGISK_CI_TOOLKIT_DIR="$(bash scripts/resolve_ci_toolkit.sh)"
      while IFS= read -r image_ref; do
        [[ -z "$image_ref" ]] && continue
        bash "$MAGISK_CI_TOOLKIT_DIR/ci/validate_image_manifest.sh" \
          --image "$image_ref" \
          --architectures "${XINYI_BACKEND_ARCHES:-amd64 arm64}"
      done < <(bash scripts/ci/gitlab_backend_container.sh list-images)
  artifacts:
    reports:
      dotenv: telegram_images.env
    paths:
      - telegram_images.env
    expire_in: 1 day

desktop-kmp:linux:x64:
  extends: .xinyi_desktop_kmp_linux
  needs: []
  tags:
    - $XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG
  script:
    - scripts/ci/gitlab_desktop_kmp_package.sh kmp-linux-x64

desktop-kmp:linux:arm64:
  extends: .xinyi_desktop_kmp_linux
  needs: []
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  script:
    - scripts/ci/gitlab_desktop_kmp_package.sh kmp-linux-arm64

desktop:release:gitlab:
  extends: .magisk_linux_base
  stage: release
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab"'
      allow_failure: true
    - when: never
  needs:
    - job: desktop-kmp:linux:x64
      artifacts: true
    - job: desktop-kmp:linux:arm64
      artifacts: true
  script:
    - chmod +x scripts/release/gitlab_desktop_release.sh
    - scripts/release/gitlab_desktop_release.sh

.xinyi_decode_google_services: &xinyi_decode_google_services |
  set -euo pipefail
  : "${GOOGLE_SERVICES_JSON:?GOOGLE_SERVICES_JSON is required for release builds}"
  mkdir -p app/src/github app/src/play
  printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/github/google-services.json
  printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/play/google-services.json

webui:check:
  extends: .xinyi_android_rules
  image: "oven/bun:1.4.4-alpine"
  stage: quality
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs: []
  # Restates .xinyi_ci_rules (job-level rules replace the inherited ones)
  # and gates the MR/branch cases on frontend/** changes, so backend- or
  # app-only MRs no longer queue a bun job on the shared arm64 runner.
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - frontend/**/*
    - when: never
  cache:
    key:
      files:
        - frontend/webui/package.json
        - frontend/webui/bun.lock
    paths:
      - .bun-cache/
  script:
    - apk add --no-cache bash ca-certificates git
    - export MAGISK_CI_TOOLKIT_DIR="$(bash scripts/resolve_ci_toolkit.sh)"
    - export BUN_CONFIG_REGISTRY="${BUN_CONFIG_REGISTRY:-https://registry.npmmirror.com}"
    - bash "$MAGISK_CI_TOOLKIT_DIR/ci/ensure_bun.sh" frontend/webui/package.json
    - |
      if [ -x "$MAGISK_CI_TOOLKIT_DIR/ci/frontend_build.sh" ]; then
        MAGISK_FRONTEND_DIR="$CI_PROJECT_DIR/frontend/webui" \
          MAGISK_FRONTEND_PACKAGE_JSON="$CI_PROJECT_DIR/frontend/webui/package.json" \
          MAGISK_FRONTEND_INSTALL_COMMAND="bun install --frozen-lockfile --ignore-scripts --cache-dir '$CI_PROJECT_DIR/.bun-cache' --registry '$BUN_CONFIG_REGISTRY'" \
          MAGISK_FRONTEND_LINT_COMMAND="bun run lint" \
          MAGISK_FRONTEND_TYPECHECK_COMMAND="bun run typecheck" \
          MAGISK_FRONTEND_TEST_COMMAND="bun run test" \
          MAGISK_FRONTEND_BUILD_COMMAND="bun run build" \
          MAGISK_FRONTEND_DIST_DIR="$CI_PROJECT_DIR/frontend/webui/dist" \
          bash "$MAGISK_CI_TOOLKIT_DIR/ci/frontend_build.sh"
      else
        cd frontend/webui
        bun install --frozen-lockfile --ignore-scripts --cache-dir "$CI_PROJECT_DIR/.bun-cache" --registry "$BUN_CONFIG_REGISTRY"
        bun run lint
        bun run typecheck
        bun run test
        bun run build
      fi
  artifacts:
    name: "XinyiRelay-webui-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - frontend/webui/dist/

# The in-app updater resolves this job by name; do not rename it.
android:build:
  extends:
    - .magisk_android_build
    - .xinyi_signed_android_rules
  tags:
    - $XINYI_BUILD_RUNNER_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Job-level rules replace the ones inherited via extends, so the
    # renovate/schedule exclusions from .xinyi_ci_rules must be restated
    # here. Without them every renovate branch push and every scheduled
    # pipeline burned a full ~20min android:build on the shared arm64
    # runner, even for webui-only dependency bumps.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - when: never
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:assembleGithubDebug
      -PbuildSplits
      -PminifyDebug
      -PskipGoogleServices=true
    # Bind artifact versionCode to the shared allocator: the pipeline iid used to
    # play this role, but Play's own scale runs ahead of it and Google Play compares
    # versionCode, not versionName. The template appends the allocated
    # -PversionCode itself (last one wins) and writes the same number into the
    # workspace, which the staging step reads back through
    # ci/allocated_version_code.sh (after_script is a separate shell).
    MAGISK_VERSION_SCOPE: "gitlab:$CI_PROJECT_ID:$CI_PIPELINE_IID"
    MAGISK_GRADLE_ARGS: "--warning-mode all"
  artifacts:
    name: "XinyiRelay-debug-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/github/debug/*.apk
      - ci-dist/app-ci.apk
      - ci-dist/version.txt
      - ci-dist/app-ci-manifest.json
  # A job-level after_script replaces the one inherited from
  # .magisk_android_base, so the otel export is restated here before staging.
  after_script:
    - |
      set +e
      if [ -x "${MAGISK_CI_TOOLKIT_DIR:-}/ci/otel_export.sh" ]; then
        bash "$MAGISK_CI_TOOLKIT_DIR/ci/otel_export.sh" "ci.job"           "magisk.toolkit_ref=${MAGISK_CI_TOOLKIT_REF:-}"           "magisk.span_source=android_base_after_script"
      else
        echo "otel: helper missing, skip"
      fi
    # The universal APK name embeds the build timestamp, while
    # GitLabCiArtifactUpdateSource can only fetch artifacts by exact path
    # (no glob), so stage a stable copy for the in-app update check, plus
    # the embedded version string as a plain-text sidecar so the update
    # dialog can display the real build timestamp.
    - |
      set -euo pipefail
      mkdir -p ci-dist
      cp app/build/outputs/apk/github/debug/universal_*.apk ci-dist/app-ci.apk
      apk_name=$(basename app/build/outputs/apk/github/debug/universal_*.apk)
      apk_version=$(echo "$apk_name" | sed -n 's/^universal_.*_v\(.*\)_debug\.apk$/\1/p')
      echo "$apk_version" > ci-dist/version.txt
      # The in-app updater judges a build by this manifest's versionCode, so it must
      # carry the allocated number rather than the pipeline iid. Staging it also
      # gates the download on the sha256 below.
      apk_sha=$(sha256sum ci-dist/app-ci.apk | cut -d' ' -f1)
      # after_script runs in its own shell, so the export made in script is gone by
      # here. The helper reads the allocated number back from the workspace file the
      # build template wrote and fails with both source names when neither is there
      # -- a silently missing manifest puts the updater back on the iid scale.
      allocated_code="$(bash "$MAGISK_CI_TOOLKIT_DIR/ci/allocated_version_code.sh")"
      printf '{"schema":1,"variant":"github","versionName":"%s","versionCode":%s,"sha256":"%s","force":true,"minSupportedVersionCode":%s}\n' \
        "$apk_version" "$allocated_code" \
        "$apk_sha" "$allocated_code" \
        > ci-dist/app-ci-manifest.json

android:check:
  extends: .magisk_android_build
  stage: quality
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:compileGithubDebugKotlin
      -PskipGoogleServices=true

cancel:older:mr:pipelines:
  extends: .magisk_cancel_older_mr_pipelines

.xinyi_android_test:
  extends:
    - .magisk_android_base
    - .xinyi_android_rules
  stage: quality
  # Switchable via XINYI_ANDROID_TEST_RUNNER_TAG (see variables above).
  tags:
    - $XINYI_ANDROID_TEST_RUNNER_TAG
  # Publish first: wait for the Play beta publish (optional, so this
  # stage still runs when the publish job is absent) instead of
  # consuming the release runner in parallel.
  needs:
    - job: android:ci:publish-play
      artifacts: false
      optional: true
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      mapfile -t selected_tasks < <(
        python3 "$MAGISK_CI_TOOLKIT_DIR/ci/select_gradle_tasks.py" \
          --root "$CI_PROJECT_DIR" \
          --toolkit "$MAGISK_CI_TOOLKIT_DIR" \
          --config "$CI_PROJECT_DIR/scripts/config/android-test-tasks.json"
      )
      if ((${#selected_tasks[@]} == 0)); then
        echo "No Android test tasks selected for this change."
        exit 0
      fi
      bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS \
        "${selected_tasks[@]}" -PskipGoogleServices=true
  artifacts:
    when: always
    expire_in: 14 days

android:test:github:
  extends: .xinyi_android_test
  artifacts:
    name: "XinyiRelay-test-github-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - app/build/test-results/testGithubDebugUnitTest/TEST-*.xml
    paths:
      - app/build/reports/kover/htmlGithubDebug/

android:detekt:
  extends:
    - .magisk_android_detekt
    - .xinyi_android_rules
  stage: quality
  tags:
    - $XINYI_BUILD_RUNNER_TAG
  # Publish first: wait for the Play beta publish (optional, so this
  # stage still runs when the publish job is absent) instead of
  # consuming the release runner in parallel.
  needs:
    - job: android:ci:publish-play
      artifacts: false
      optional: true
  allow_failure: true
  variables:
    MAGISK_ANDROID_DETEKT_TASKS: >-
      detekt
      --continue
      -PskipGoogleServices=true
  artifacts:
    name: "XinyiRelay-detekt-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - merged-sarif/detekt.sarif
      - "**/build/reports/detekt/**"

# The Matrix E2EE plugin APK is standalone (not part of the app's dependency
# graph), so app compile jobs never build it. This job keeps the plugin module
# compiling on MRs that touch it; gated on changes because the plugin pulls the
# full matrix-rust-sdk native payload (~250MB across ABIs).
e2ee-plugin:check:
  extends: .magisk_android_build
  stage: quality
  needs: []
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - features/matrix-e2ee-plugin/**/*
        - modules/relay/matrix-e2ee/**/*
        - modules/relay/sender/api/**/*
        - gradle/libs.versions.toml
    - when: never
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :features:matrix_e2ee_plugin:assembleDebug
      -PskipGoogleServices=true

# Matrix E2EE plugin publish -- decoupled from the app release cadence.
# The plugin is versioned by the upstream matrix-rust-sdk it bundles, so it only
# ships when the catalog version moves (Renovate bumps matrix-sdk-android, then
# this job notices the catalog version is not yet published and publishes it).
# The beta push rule publishes the moment the bump lands; the schedule below is
# a backstop, because a scheduled run checks out its pipeline SHA, which
# predates any bump the same pipeline's renovate:gitlab job produces -- the
# schedule alone always lags one period (and a job retry is equally blind,
# since it re-runs on the same pipeline SHA). Manual web runs force a
# republish of the current catalog version; uploads are idempotent
# (409 = already there).
e2ee-plugin:sync:
  extends: .magisk_android_base
  stage: maintenance
  needs: []
  # The build+upload takes minutes; beta receives pushes every few minutes
  # during Renovate windows and workflow auto_cancel would otherwise kill a
  # running publish mid-flight. renovate:gitlab is non-interruptible for the
  # same reason.
  interruptible: false
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    # New matrix-sdk catalog version on beta: publish right away instead of
    # waiting for the next scheduled run. The script's skip-if-published
    # check makes unrelated catalog bumps no-ops (exit 0 before any build).
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
      changes:
        - gradle/libs.versions.toml
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never
  script:
    - chmod +x scripts/ci/e2ee_plugin_publish.sh
    - |
      set -euo pipefail
      # The plugin APK must carry the same release signature as the host app:
      # the host loader rejects any plugin whose certificate differs. Decode the
      # keystore and hand the credentials to the signing convention plugin via
      # the environment (same contract as .magisk_android_release_apk).
      : "${RELEASE_KEYSTORE:?RELEASE_KEYSTORE is required}"
      : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
      : "${KEY_ALIAS:?KEY_ALIAS is required}"
      : "${KEY_PASSWORD:?KEY_PASSWORD is required}"
      keystore_path="$CI_PROJECT_DIR/release.jks"
      mkdir -p "$(dirname "$keystore_path")"
      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$keystore_path"
      chmod 0600 "$keystore_path"
      export KEYSTORE_FILE="$keystore_path"
      export STORE_PASSWORD KEY_ALIAS KEY_PASSWORD

      catalog_sdk="$(sed -nE 's/^matrix-sdk-android[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)"
      if [ -z "$catalog_sdk" ]; then
        echo "ERROR: cannot resolve matrix-sdk-android from gradle/libs.versions.toml" >&2
        exit 2
      fi
      # Scheduled runs only publish catalog versions the registry does not have
      # yet. A manual web run must always republish: the plugin APK is built
      # from this pipeline's sources, so an already-published version can still
      # be stale (e.g. a loader-contract fix that changed how the plugin is
      # built). Uploads are idempotent, so republishing is safe.
      if [ "$CI_PIPELINE_SOURCE" != "web" ]; then
        published="$(curl --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages?package_name=xinyi-e2ee-plugin&per_page=100" \
          | grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' | sed -E 's/.*"([^"]+)"$/\1/' | sort -V || true)"
        if printf '%s\n' "$published" | grep -qx "$catalog_sdk"; then
          echo "E2EE plugin for matrix-sdk $catalog_sdk is already published; nothing to do."
          exit 0
        fi
        echo "Publishing E2EE plugin for matrix-sdk $catalog_sdk (already published: ${published:-none})."
      else
        echo "Republishing E2EE plugin for matrix-sdk $catalog_sdk (manual web run)."
      fi
      scripts/ci/e2ee_plugin_publish.sh

# rustls-platform-verifier JVM component publish -- decoupled from the app
# release cadence. matrix-rust-sdk reflects into this AAR at runtime but does
# not depend on it in Gradle, and upstream never ships it to Maven, so the
# registry copy (settings.gradle.kts pins group "rustls" to it) is built here
# from the pinned upstream tag with this repository's own toolchain. Scheduled
# pipelines only publish catalog versions the registry does not have yet; MRs
# run a dry run (build + contract check, no registry writes) so a broken
# toolchain patch is caught before it can publish a wrong artifact.
rustls-platform-verifier:publish:
  extends: .magisk_android_base
  stage: build
  needs: []
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - gradle/libs.versions.toml
        - scripts/ci/rustls_pv_publish.sh
        - scripts/ci/rustls_pv_toolchain.patch
        - .gitlab-ci.yml
      variables:
        RUSTLS_PV_DRY_RUN: "1"
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - gradle/libs.versions.toml
        - scripts/ci/rustls_pv_publish.sh
        - scripts/ci/rustls_pv_toolchain.patch
        - .gitlab-ci.yml
    - when: never
  script:
    - chmod +x scripts/ci/rustls_pv_publish.sh
    - scripts/ci/rustls_pv_publish.sh
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - .cache/rustls-platform-verifier/*.aar
      - .cache/rustls-platform-verifier/*.pom

security:gitleaks:
  extends: .xinyi_ci_rules
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  stage: quality
  needs: []
  script:
    - gitleaks detect --source . --redact --no-banner

android:release:guard:
  extends: .magisk_android_release_guard
  stage: build
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs: []

android:release:apk:
  # Driven by the shared template. The project only declares what is
  # project-specific: the GitHub flavours and the split flag. Keystore
  # decoding, version resolution and signature validation are the template's
  # job now, and play-release.env carries the version decision downstream so
  # android:release:modules-repo does not have to re-derive it.
  extends: .magisk_android_release_apk
  variables:
    MAGISK_ANDROID_RELEASE_APK_TASKS: ":app:assembleGithubRelease"
    MAGISK_ANDROID_RELEASE_GRADLE_EXTRA_ARGS: "-PbuildSplits"
  before_script:
    - !reference [.magisk_android_base, before_script]
    - *xinyi_decode_google_services
  resource_group: xinyi-android-release-apk
  stage: build
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: android:release:guard
      artifacts: false
  artifacts:
    name: "XinyiRelay-release-apks-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/**/release/*.apk
      - app/build/outputs/mapping/**/mapping.txt
      - play-release.env

android:release:aab:
  extends:
    - .magisk_android_base
    - .magisk_android_release_tag_rules
  resource_group: xinyi-android-release-play
  stage: build
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true"'
    - when: never
  needs:
    - job: android:release:guard
      artifacts: false
  variables:
    # Declared so the contract assertion below fails fast if it is ever emptied,
    # mirroring the shared .magisk_android_release_aab template. xinyi cannot use
    # that template directly because it must decode google-services.json first.
    MAGISK_ANDROID_RELEASE_AAB_TASKS: ":app:bundlePlayRelease"
    MAGISK_PLAY_TRACK_OVERRIDE: "production"
  script:
    - *xinyi_decode_google_services
    - |
      set -euo pipefail
      : "${MAGISK_ANDROID_RELEASE_AAB_TASKS:?MAGISK_ANDROID_RELEASE_AAB_TASKS is required (the gradle task list, e.g. ':app:bundlePlayRelease')}"
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      : "${RELEASE_KEYSTORE:?RELEASE_KEYSTORE is required}"
      : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
      : "${KEY_ALIAS:?KEY_ALIAS is required}"
      : "${KEY_PASSWORD:?KEY_PASSWORD is required}"

      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > app/release.jks
      bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
        --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
        --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
        --output "$CI_PROJECT_DIR/play-release.env" \
        --initial-version-code "$MAGISK_PLAY_INITIAL_VERSION_CODE"
      source "$CI_PROJECT_DIR/play-release.env"
      KEYSTORE_FILE="app/release.jks" \
      STORE_PASSWORD="$STORE_PASSWORD" \
      KEY_ALIAS="$KEY_ALIAS" \
      KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS ${MAGISK_ANDROID_RELEASE_AAB_TASKS} \
          -PversionName="$MAGISK_PLAY_VERSION_NAME" -PversionCode="$MAGISK_PLAY_VERSION_CODE"
  artifacts:
    name: "XinyiRelay-release-bundle-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/mapping/**/mapping.txt
      - play-release.env

android:release:gitlab:
  extends: .magisk_android_gitlab_release
  resource_group: xinyi-android-release-publish
  stage: release
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: android:release:apk
      artifacts: true
    - job: android:release:aab
      artifacts: true
      optional: true

android:release:publish-play:
  extends: .magisk_android_publish_play
  resource_group: xinyi-android-release-play
  stage: release
  # Play publishing is best effort: a Play-side block (policy review,
  # accessibility permission declaration, track rejection) must not hold back
  # the remaining release channels or the Telegram release notification.
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/ && $RELEASE_OWNER == "gitlab" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
    - when: never
  variables:
    MAGISK_PLAY_TRACK_OVERRIDE: "production"
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: android:release:aab
      artifacts: true
  artifacts:
    reports:
      dotenv: play-release-status.env
    paths:
      - play-release-status.env
    when: always
    expire_in: 1 day

android:ci:aab:
  extends: .magisk_android_base
  resource_group: xinyi-android-release-play
  stage: build
  tags:
    - $XINYI_BUNDLE_RUNNER_TAG
  # The release build is self-contained (keystore and google-services.json
  # come from CI variables, assets from the repository), so the publish chain
  # must not wait for the build/package stages: Play publishing keeps
  # priority over the quality stage.
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != "" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_AUTHOR =~ /Renovate317@users.noreply/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != "" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
      when: on_success
    - when: never
  variables:
    MAGISK_IS_CI_BUILD: "true"
  script:
    - *xinyi_decode_google_services
    - |
      set -euo pipefail
      export MAGISK_PLAY_TRACK_OVERRIDE=beta
      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > app/release.jks
      bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
        --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
        --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
        --output "$CI_PROJECT_DIR/play-release.env" \
        --initial-version-code "$MAGISK_PLAY_INITIAL_VERSION_CODE"
      source "$CI_PROJECT_DIR/play-release.env"
      KEYSTORE_FILE=app/release.jks STORE_PASSWORD="$STORE_PASSWORD" KEY_ALIAS="$KEY_ALIAS" KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS :app:bundlePlayRelease \
          -PversionName="$MAGISK_PLAY_VERSION_NAME" -PversionCode="$MAGISK_PLAY_VERSION_CODE"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/mapping/**/mapping.txt
      - play-release.env

android:ci:publish-play:
  extends: .magisk_utility_base
  resource_group: xinyi-android-release-play
  stage: release
  interruptible: false
  tags:
    - $XINYI_BUILD_RUNNER_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_AUTHOR =~ /Renovate317@users.noreply/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
      when: on_success
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_AUTHOR =~ /Renovate317@users.noreply/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
      when: on_success
    - when: never
  needs:
    - job: android:ci:aab
      artifacts: true
  # .magisk_utility_base ships the image only, and this job runs
  # release/publish_play.sh from the toolkit, so resolve the toolkit here with
  # the same contract .magisk_linux_base uses. bash/curl/python3/jq/openssl are
  # pre-baked into utility:3.24; only the toolkit checkout was missing.
  variables:
    MAGISK_CI_TOOLKIT_DIR: "$CI_PROJECT_DIR/.magisk-ci-toolkit"
  before_script:
    - |
      set -euo pipefail
      chmod +x scripts/resolve_ci_toolkit.sh
      bash scripts/resolve_ci_toolkit.sh >/dev/null
  script:
    - |
      set -euo pipefail
      set -a
      source play-release.env
      set +a
      export MAGISK_PLAY_AAB_FILE="$(find app/build/outputs/bundle -type f -name '*.aab' | sort | head -n 1)"
      export MAGISK_PLAY_MAPPING_FILE="$(find app/build/outputs/mapping -type f -name mapping.txt | sort | head -n 1 || true)"
      export MAGISK_PLAY_SYMBOLS_FILE="$(find app/build/outputs/native-debug-symbols -type f -name native-debug-symbols.zip 2>/dev/null | sort | head -n 1 || true)"
      export MAGISK_RELEASE_ENV_FILE=play-release-status.env
      bash "$MAGISK_CI_TOOLKIT_DIR/release/publish_play.sh"
  artifacts:
    when: always
    expire_in: 1 day
    reports:
      dotenv: play-release-status.env
    paths:
      - play-release-status.env

android:release:modules-repo:
  # The modules repo publishes release APKs, and only android:release:apk
  # produces them (android:release:aab emits an AAB). Pointing this at play-bundle made
  # the template's APK lookup fail with "no release APK files found".
  extends: .magisk_android_publish_modules_repo
  resource_group: xinyi-android-release-publish
  stage: release
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: android:release:apk
      artifacts: true


telegram:release:
  extends: .magisk_telegram_release
  stage: release
  allow_failure: true
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "#XinyiRelay"
    MAGISK_TELEGRAM_PROJECT_NAME: "XinyiRelay"
    MAGISK_TELEGRAM_IMAGE_LIST_COMMAND: "bash scripts/ci/gitlab_backend_container.sh list-images"
    # Use TG_RELEASE_CHAT_ID instead of TG_CHAT_ID so that the project-level
    # TG_CHAT_ID (which retargets CI to the new room) does NOT override this.
    TG_RELEASE_CHAT_ID: "-1003532345372"
  needs:
    - job: android:release:apk
      artifacts: true
    - job: backend:container:manifest
      artifacts: true
    - job: android:release:gitlab
      artifacts: false

telegram:ci:
  extends:
    - .magisk_telegram_ci
    - .xinyi_signed_android_rules
  stage: release
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_AUTHOR =~ /Renovate317@users.noreply/ && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
      when: manual
      allow_failure: true
    - when: never
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "#XinyiRelay"
    MAGISK_TELEGRAM_PROJECT_NAME: "XinyiRelay"
    MAGISK_TELEGRAM_CI_BRANCH: "beta"
    # CI builds are informational; no need to pin in the new CI room.
    MAGISK_TELEGRAM_PIN: "false"
  needs:
    - job: android:build
      artifacts: true
      optional: true

renovate:gitlab:
  extends: .magisk_renovate_gitlab
  interruptible: false
  stage: maintenance
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  variables:
    # Renovate skips github-tags/github-releases deps when no GitHub token is
    # present. GITHUB_PAT is a protected group variable, and this job only runs
    # on the protected default branch (beta), so it is available here.
    GITHUB_TOKEN: "$GITHUB_PAT"

# Mirrors the GitLab-owned release to GitHub (tag, notes, release APKs).
# Inert unless GITHUB_RELEASE_TOKEN is configured for the project.
android:release:github:
  extends: .magisk_android_release_github
  resource_group: xinyi-android-release-publish
  stage: release
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  variables:
    # Must stay job-level: the toolkit template pins the same key at job level
    # to "*arm64-v8a*.apk", and job variables outrank the global variables
    # block, so a global override here would be silently ignored.
    MAGISK_ANDROID_RELEASE_GITHUB_ASSET_PATTERN: "*.apk"
  needs:
    - job: android:release:apk
      artifacts: true
    # gh release create would otherwise invent the tag at the GitHub default
    # branch HEAD while the mirror has not published it yet.
    - job: sync:github

# Keeps the public GitHub mirror in step with GitLab. GITHUB_PAT is a
# group-level protected variable, so it is only injected on protected branches;
# tag pipelines fall back to the project-level GITHUB_RELEASE_TOKEN.
sync:github:
  # The shared anchor owns the push: default branch plus release tags, with the
  # internal safety-net prefixes (backup/, archive/, tmp/, wip/, keep/) withheld.
  # This is the repository that leaked one: `git push --tags --force` published
  # archive/api101-20260614 to GitHub, where it could not be taken back quietly.
  extends: .magisk_github_sync
  # Kept in the release stage because android:release:github needs the tag to be
  # on GitHub before it creates the release there.
  stage: release
  needs:
    - job: android:release:guard
      optional: true
  variables:
    # Written out rather than reused from MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY:
    # the mirror target is its own contract and must not follow a release setting.
    MAGISK_GITHUB_MIRROR_REPOSITORY: "magisk317/xinyi-relay"

# Scheduled/manual README badge sync (replaces the retired GitHub workflow).
sync:readme-badges:
  extends:
    - .magisk_utility_base
    - .magisk_readme_badges
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
