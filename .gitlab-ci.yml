include:
  - project: magisk3171/magisk-ci-toolkit
    ref: bd6f53afff05b26754edb6785f6503e9aa60a9a6
    file: /.gitlab/ci/android.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: bd6f53afff05b26754edb6785f6503e9aa60a9a6
    file: /.gitlab/ci/android-release.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: bd6f53afff05b26754edb6785f6503e9aa60a9a6
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: bd6f53afff05b26754edb6785f6503e9aa60a9a6
    file: /.gitlab/ci/renovate.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - magisk-local-linux

stages:
  - build
  - quality
  - notify
  - release-validate
  - package
  - release-build
  - release-publish
  - maintenance

variables:
  MAGISK_CI_TOOLKIT_REF: "bd6f53afff05b26754edb6785f6503e9aa60a9a6"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "0"
  MAGISK_ANDROID_SDKMANAGER_CHANNEL: "3"
  MAGISK_ANDROID_COMPILE_SDK: "37"
  MAGISK_ANDROID_COMPILE_SDK_PACKAGE: "platforms;android-37.0"
  MAGISK_ANDROID_SDK_PACKAGES: "platform-tools build-tools;37.0.0"
  MAGISK_GRADLE_ARGS: "--warning-mode all"
  MAGISK_ANDROID_RELEASE_PACKAGE_NAME: "io.github.magisk317.xinyi.relay"
  MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY: ""
  MAGISK_ANDROID_RELEASE_MODULES_REPO: ""
  MAGISK_ANDROID_RELEASE_PUBLISH_PLAY: "true"
  MAGISK_ANDROID_RELEASE_PLAY_TRACK: "production"
  MAGISK_RENOVATE_REPOSITORY: "magisk3171/xinyi-relay"
  XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG: "saas-linux-small-amd64"
  XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG: "saas-linux-small-arm64"
  XINYI_GITLAB_WINDOWS_AMD64_RUNNER_TAG: "saas-windows-medium-amd64"
  XINYI_GITLAB_MACOS_ARM64_RUNNER_TAG: "saas-macos-medium-m1"
  XINYI_GITLAB_MACOS_ENABLED: "false"

.xinyi_ci_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .renovate\/.+ into /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

.xinyi_android_rules:
  extends: .xinyi_ci_rules

.xinyi_backend_publish_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

.xinyi_package_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

.xinyi_docker:
  image: "docker:29-cli"
  services:
    - name: "docker:29-dind"
      alias: docker
      command: ["--tls=false", "--mtu=1400"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    HTTP_PROXY: "$CI_HTTP_PROXY"
    HTTPS_PROXY: "$CI_HTTPS_PROXY"
    http_proxy: "$CI_HTTP_PROXY"
    https_proxy: "$CI_HTTPS_PROXY"
    NO_PROXY: "$CI_NO_PROXY,auth.docker.io,registry-1.docker.io,production.cloudflare.docker.com,docker.io"
    no_proxy: "$CI_NO_PROXY,auth.docker.io,registry-1.docker.io,production.cloudflare.docker.com,docker.io"
    GOPROXY: "https://goproxy.cn,direct"
  before_script:
    - |
      if ! apk add --no-cache bash curl git jq; then
        echo "Alpine mirror failed, falling back to official" >&2
        sed -i 's#https://mirrors.tuna.tsinghua.edu.cn/alpine#https://dl-cdn.alpinelinux.org/alpine#g' /etc/apk/repositories 2>/dev/null || true
        apk add --no-cache bash curl git jq
      fi
    - |
      set -euo pipefail
      if [ -n "${HTTP_PROXY:-${http_proxy:-}}" ] || [ -n "${HTTPS_PROXY:-${https_proxy:-}}" ]; then
        mkdir -p "$HOME/.docker"
        cat > "$HOME/.docker/config.json" <<EOF
      {
        "proxies": {
          "default": {
            "httpProxy": "${HTTP_PROXY:-${http_proxy:-}}",
            "httpsProxy": "${HTTPS_PROXY:-${https_proxy:-}}",
            "noProxy": "${NO_PROXY:-${no_proxy:-}}"
          }
        }
      }
      EOF
      fi
    - docker version
    - docker buildx version

.xinyi_desktop_linux:
  extends: .xinyi_package_rules
  image: "node:24-bookworm"
  stage: package
  variables:
    RUSTUP_MAX_RETRIES: "10"
  before_script:
    - chmod +x scripts/ci/gitlab_desktop_package.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - desktop-artifacts/

.xinyi_desktop_macos:
  extends: .xinyi_package_rules
  stage: package
  variables:
    RUSTUP_MAX_RETRIES: "10"
  before_script:
    - chmod +x scripts/ci/gitlab_desktop_package.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - desktop-artifacts/

.xinyi_desktop_windows:
  extends: .xinyi_package_rules
  stage: package
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - desktop-artifacts/

backend:go:
  extends: .xinyi_ci_rules
  image: "golang:1.26.5-bookworm"
  stage: quality
  needs: []
  variables:
    GOPROXY: "https://goproxy.cn,direct"
  script:
    - |
      set -euo pipefail
      cd backend/api
      test -z "$(gofmt -l .)"
      mkdir -p webui_dist
      touch webui_dist/.gitkeep
      go test ./...
      go build ./...

backend:smoke:
  extends:
    - .xinyi_docker
    - .xinyi_ci_rules
  stage: quality
  variables:
    BASE_URL: "http://docker:8088"
  needs:
    - job: backend:go
      artifacts: false
  script:
    - |
      set -euo pipefail
      docker compose version
      cp backend/.env.example backend/.env
      docker compose -f backend/docker-compose.yml config
      rm -f backend/.env
      chmod +x backend/scripts/smoke_local.sh
      backend/scripts/smoke_local.sh

backend:container:amd64:
  extends:
    - .xinyi_docker
    - .xinyi_backend_publish_rules
  stage: package
  tags:
    - $XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG
  needs:
    - job: backend:go
      artifacts: false
    - job: backend:smoke
      artifacts: false
  script:
    - chmod +x scripts/ci/gitlab_backend_container.sh
    - scripts/ci/gitlab_backend_container.sh build-arch amd64

backend:container:arm64:
  extends:
    - .xinyi_docker
    - .xinyi_backend_publish_rules
  stage: package
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: backend:go
      artifacts: false
    - job: backend:smoke
      artifacts: false
  script:
    - chmod +x scripts/ci/gitlab_backend_container.sh
    - scripts/ci/gitlab_backend_container.sh build-arch arm64

backend:container:manifest:
  extends:
    - .xinyi_docker
    - .xinyi_backend_publish_rules
  stage: release-publish
  needs:
    - job: backend:container:amd64
      artifacts: false
    - job: backend:container:arm64
      artifacts: false
  script:
    - chmod +x scripts/ci/gitlab_backend_container.sh
    - scripts/ci/gitlab_backend_container.sh publish-manifests

desktop:linux:x64:
  extends: .xinyi_desktop_linux
  needs: []
  tags:
    - $XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG
  script:
    - scripts/ci/gitlab_desktop_package.sh linux linux-x64 x86_64-unknown-linux-gnu "--target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm" "frontend/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"

desktop:linux:arm64:
  extends: .xinyi_desktop_linux
  needs: []
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  script:
    - scripts/ci/gitlab_desktop_package.sh linux linux-arm64 aarch64-unknown-linux-gnu "--target aarch64-unknown-linux-gnu --bundles appimage,deb,rpm" "frontend/desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle"

desktop:windows:x64:
  extends: .xinyi_desktop_windows
  needs: []
  tags:
    - $XINYI_GITLAB_WINDOWS_AMD64_RUNNER_TAG
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/gitlab_desktop_windows.ps1 -ArtifactSuffix windows-x64 -RustTarget x86_64-pc-windows-msvc -BundleArgs "--target x86_64-pc-windows-msvc --bundles nsis" -BundleDir "frontend/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"

desktop:macos:arm64:
  extends: .xinyi_desktop_macos
  needs: []
  rules:
    - if: '$XINYI_GITLAB_MACOS_ENABLED != "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never
  tags:
    - $XINYI_GITLAB_MACOS_ARM64_RUNNER_TAG
  script:
    - scripts/ci/gitlab_desktop_package.sh macos macos-arm64 aarch64-apple-darwin "--target aarch64-apple-darwin --bundles app,dmg" "frontend/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"

desktop:release:gitlab:
  image: "python:3.14-slim"
  stage: release-publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab"'
      when: manual
      allow_failure: true
    - when: never
  needs:
    - job: desktop:linux:x64
      artifacts: true
    - job: desktop:linux:arm64
      artifacts: true
    - job: desktop:windows:x64
      artifacts: true
    - job: desktop:macos:arm64
      artifacts: true
      optional: true
  before_script:
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      sed -i \
        -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
        -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
        -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
        -e 's#http://archive.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
        -e 's#http://security.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
        /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
      if ! apt-get update; then
        echo "Mirror apt-get update failed, falling back to official sources" >&2
        sed -i \
          -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian-security#http://deb.debian.org/debian-security#g' \
          -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian#http://deb.debian.org/debian#g' \
          -e 's#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
        apt-get update
      fi
    - apt-get install -y --no-install-recommends bash curl
    - rm -rf /var/lib/apt/lists/*
  script:
    - chmod +x scripts/release/gitlab_desktop_release.sh
    - scripts/release/gitlab_desktop_release.sh

.xinyi_decode_google_services: &xinyi_decode_google_services |
  set -euo pipefail
  : "${GOOGLE_SERVICES_JSON:?GOOGLE_SERVICES_JSON is required for release builds}"
  mkdir -p app/src/github app/src/githubNoE2ee app/src/githubWithE2ee app/src/play
  printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/github/google-services.json
  printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/githubNoE2ee/google-services.json
  printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/githubWithE2ee/google-services.json
  printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/play/google-services.json

webui:check:
  extends: .xinyi_android_rules
  image: "node:24-bookworm"
  stage: quality
  needs: []
  cache:
    key:
      files:
        - frontend/webui/package.json
        - frontend/webui/pnpm-lock.yaml
    paths:
      - .pnpm-store/
  script:
    - |
      set -euo pipefail
      corepack enable
      corepack prepare "$(node -p "require('./frontend/webui/package.json').packageManager")" --activate
      pnpm -C frontend/webui config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
      # Use npmmirror as primary registry, fallback to official on failure
      pnpm -C frontend/webui config set registry https://registry.npmmirror.com
      if ! pnpm -C frontend/webui install --frozen-lockfile --ignore-scripts; then
        echo "npmmirror install failed, falling back to official registry" >&2
        pnpm -C frontend/webui config set registry https://registry.npmjs.org
        pnpm -C frontend/webui install --frozen-lockfile --ignore-scripts
      fi
      pnpm -C frontend/webui lint
      pnpm -C frontend/webui typecheck
      pnpm -C frontend/webui test
      pnpm -C frontend/webui build
  artifacts:
    name: "XinyiRelay-webui-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - frontend/webui/dist/

android:build:
  extends:
    - .magisk_android_build
    - .xinyi_android_rules
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:assembleGithubNoE2eeDebug
      :app:assembleGithubWithE2eeDebug
      -PallowIncompatibleDebugSigning=true
      -PbuildSplits
      -PskipGoogleServices=true
  artifacts:
    name: "XinyiRelay-debug-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/github*/debug/*.apk

.xinyi_android_test:
  extends:
    - .magisk_android_base
    - .xinyi_android_rules
  stage: quality
  needs: []
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      : "${XINYI_ANDROID_TEST_TASKS:?XINYI_ANDROID_TEST_TASKS is required}"
      bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS $XINYI_ANDROID_TEST_TASKS \
        -PallowIncompatibleDebugSigning=true \
        -PskipGoogleServices=true
  artifacts:
    when: always
    expire_in: 14 days

android:test:noe2ee:
  extends: .xinyi_android_test
  variables:
    XINYI_ANDROID_TEST_TASKS: >-
      :app:testGithubNoE2eeDebugUnitTest
      :app:koverHtmlReportGithubNoE2eeDebug
      verifyStructureBoundaries
  artifacts:
    name: "XinyiRelay-test-noe2ee-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - app/build/test-results/testGithubNoE2eeDebugUnitTest/TEST-*.xml
    paths:
      - app/build/reports/kover/htmlGithubNoE2eeDebug/

android:test:withe2ee:
  extends: .xinyi_android_test
  variables:
    XINYI_ANDROID_TEST_TASKS: >-
      :app:testGithubWithE2eeDebugUnitTest
      :app:koverHtmlReportGithubWithE2eeDebug
  artifacts:
    name: "XinyiRelay-test-withe2ee-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - app/build/test-results/testGithubWithE2eeDebugUnitTest/TEST-*.xml
    paths:
      - app/build/reports/kover/htmlGithubWithE2eeDebug/

android:detekt:
  extends:
    - .magisk_android_detekt
    - .xinyi_android_rules
  stage: quality
  needs: []
  allow_failure: true
  variables:
    MAGISK_ANDROID_DETEKT_TASKS: >-
      detekt
      --continue
      -PallowIncompatibleDebugSigning=true
      -PskipGoogleServices=true
  artifacts:
    name: "XinyiRelay-detekt-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - merged-sarif/detekt.sarif
      - "**/build/reports/detekt/**"

android:release:guard:
  extends: .magisk_android_release_guard
  stage: release-validate
  needs: []

android:release:github-apk:
  extends:
    - .magisk_android_base
    - .magisk_android_release_tag_rules
  stage: release-build
  needs:
    - job: android:release:guard
      artifacts: false
  script:
    - *xinyi_decode_google_services
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      : "${RELEASE_KEYSTORE:?RELEASE_KEYSTORE is required}"
      : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
      : "${KEY_ALIAS:?KEY_ALIAS is required}"
      : "${KEY_PASSWORD:?KEY_PASSWORD is required}"

      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > app/release.jks
      KEYSTORE_FILE="release.jks" \
      STORE_PASSWORD="$STORE_PASSWORD" \
      KEY_ALIAS="$KEY_ALIAS" \
      KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS \
          :app:assembleGithubNoE2eeRelease \
          :app:assembleGithubWithE2eeRelease \
          -PbuildSplits
  artifacts:
    name: "XinyiRelay-release-apks-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/**/release/*.apk
      - app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip

android:release:play-bundle:
  extends:
    - .magisk_android_base
    - .magisk_android_release_tag_rules
  stage: release-build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true"'
    - when: never
  needs:
    - job: android:release:guard
      artifacts: false
  script:
    - *xinyi_decode_google_services
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      : "${RELEASE_KEYSTORE:?RELEASE_KEYSTORE is required}"
      : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
      : "${KEY_ALIAS:?KEY_ALIAS is required}"
      : "${KEY_PASSWORD:?KEY_PASSWORD is required}"

      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > app/release.jks
      KEYSTORE_FILE="release.jks" \
      STORE_PASSWORD="$STORE_PASSWORD" \
      KEY_ALIAS="$KEY_ALIAS" \
      KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS :app:bundlePlayRelease
  artifacts:
    name: "XinyiRelay-release-bundle-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/mapping/**/mapping.txt
      - app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip

android:release:gitlab:
  extends: .magisk_android_gitlab_release
  stage: release-publish
  needs:
    - job: android:release:github-apk
      artifacts: true
    - job: android:release:play-bundle
      artifacts: true
      optional: true

android:release:play:
  extends: .magisk_android_publish_play
  stage: release-publish
  needs:
    - job: android:release:play-bundle
      artifacts: true

android:release:modules-repo:
  extends: .magisk_android_publish_modules_repo
  stage: release-publish
  needs:
    - job: android:release:github-apk
      artifacts: true

telegram:release:
  extends: .magisk_telegram_release
  stage: release-publish
  allow_failure: true
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "#XinyiRelay"
    MAGISK_TELEGRAM_PROJECT_NAME: "XinyiRelay"
    MAGISK_TELEGRAM_RELEASE_ARTIFACT_PATTERN: "*arm64-v8a*NoE2ee*.apk"
  needs:
    - job: android:release:github-apk
      artifacts: true

telegram:ci:
  extends: .magisk_telegram_ci
  stage: notify
  allow_failure: true
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "#XinyiRelay"
    MAGISK_TELEGRAM_PROJECT_NAME: "XinyiRelay"
    MAGISK_TELEGRAM_CI_BRANCH: "beta"
    MAGISK_TELEGRAM_CI_ARTIFACT_PATTERN: "*arm64-v8a*NoE2ee*.apk"
  needs:
    - job: android:build
      artifacts: true
      optional: true

renovate:gitlab:
  extends: .magisk_renovate_gitlab
  stage: maintenance
