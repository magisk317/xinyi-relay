include:
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/android.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/android-release.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/renovate.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/cancel-mr-pipelines.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - $XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG

stages:
  - build
  - package
  - release-validate
  - release-build
  # sync must precede release-publish: android:release:github declares
  # `needs: sync:github`, and `needs` may only target the same or an earlier stage.
  - sync
  - release-publish
  - notify
  - quality
  - maintenance

variables:
  MAGISK_CI_TOOLKIT_REPOSITORY: "https://gitlab.com/magisk3171/shared/magisk-ci-toolkit.git"
  MAGISK_CI_TOOLKIT_REF: "v1"
  MAGISK_CANCEL_OLDER_MR_PIPELINES: "true"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "0"
  MAGISK_ANDROID_SDKMANAGER_CHANNEL: "3"
  MAGISK_ANDROID_COMPILE_SDK: "37.2"
  MAGISK_ANDROID_COMPILE_SDK_PACKAGE: "platforms;android-37.2"
  MAGISK_ANDROID_SDK_PACKAGES: "platform-tools build-tools;37.0.0"
  MAGISK_GRADLE_ARGS: "--warning-mode all"
  MAGISK_ANDROID_RELEASE_PACKAGE_NAME: "io.github.magisk317.xinyi.relay"
  MAGISK_ANDROID_RELEASE_PLAY_URL: "https://play.google.com/store/apps/details?id=io.github.magisk317.xinyi.relay"
  MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY: "magisk317/xinyi-relay"
  MAGISK_ANDROID_RELEASE_MODULES_REPO: "Xposed-Modules-Repo/io.github.magisk317.xinyi.relay"
  MAGISK_ANDROID_RELEASE_PUBLISH_PLAY: "true"
  # Public SHA-256 fingerprint of the production APK signing certificate.
  MAGISK_ANDROID_RELEASE_CERT_SHA256: "027b936e1d82a606d83599548b8b11e49a2c8ae2588c4a9fbe8311e2c54f103a"
  # Floor for the derived Play versionCode. Must stay at (or above) the highest
  # versionCode already live on Play so that, when the Play API cannot be queried,
  # resolve_play_release.sh never derives a code Play would reject as a downgrade.
  MAGISK_PLAY_INITIAL_VERSION_CODE: "46"
  MAGISK_RENOVATE_REPOSITORY: "magisk3171/xinyi-relay"
  XINYI_DOCKERHUB_PUBLISH: "true"
  XINYI_BACKEND_ARCHES: "amd64 arm64"
  XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG: "magisk-amd64-linux"
  XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG: "magisk-arm64-linux"
  XINYI_GITLAB_WINDOWS_AMD64_RUNNER_TAG: "saas-windows-medium-amd64"
  XINYI_GITLAB_MACOS_ARM64_RUNNER_TAG: "saas-macos-medium-m1"
  XINYI_GITLAB_MACOS_ENABLED: "false"

.xinyi_ci_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - when: never

.xinyi_android_rules:
  extends: .xinyi_ci_rules
  cache: []

.xinyi_signed_android_rules:
  cache: []
  rules:
    - if: '$RELEASE_KEYSTORE == "" || $STORE_PASSWORD == "" || $KEY_ALIAS == "" || $KEY_PASSWORD == ""'
      when: never
    - !reference [.xinyi_ci_rules, rules]

.xinyi_backend_validation_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - !reference [.xinyi_ci_rules, rules]

.xinyi_backend_publish_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

.xinyi_package_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

.xinyi_docker:
  image: "docker:29-cli"
  services:
    - name: "docker:29-dind"
      command: ["--tls=false", "--mtu=1400"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    HTTP_PROXY: "$CI_HTTP_PROXY"
    HTTPS_PROXY: "$CI_HTTPS_PROXY"
    http_proxy: "$CI_HTTP_PROXY"
    https_proxy: "$CI_HTTPS_PROXY"
    NO_PROXY: "$CI_NO_PROXY,auth.docker.io,registry-1.docker.io,production.cloudflare.docker.com,docker.io"
    no_proxy: "$CI_NO_PROXY,auth.docker.io,registry-1.docker.io,production.cloudflare.docker.com,docker.io"
  before_script:
    - |
      use_mirror="${MAGISK_LINUX_USE_MIRROR:-true}"
      if [ "$use_mirror" = "true" ]; then
        sed -i 's#https://dl-cdn.alpinelinux.org/alpine#https://mirrors.tuna.tsinghua.edu.cn/alpine#g' /etc/apk/repositories 2>/dev/null || true
      fi
      if ! apk add --no-cache bash curl git jq; then
        echo "Alpine package source failed, falling back to official" >&2
        sed -i 's#https://mirrors.tuna.tsinghua.edu.cn/alpine#https://dl-cdn.alpinelinux.org/alpine#g' /etc/apk/repositories 2>/dev/null || true
        apk add --no-cache bash curl git jq
      fi
    - |
      set -euo pipefail
      if [ -n "${HTTP_PROXY:-${http_proxy:-}}" ] || [ -n "${HTTPS_PROXY:-${https_proxy:-}}" ]; then
        mkdir -p "$HOME/.docker"
        cat > "$HOME/.docker/config.json" <<EOF
      {
        "proxies": {
          "default": {
            "httpProxy": "${HTTP_PROXY:-${http_proxy:-}}",
            "httpsProxy": "${HTTPS_PROXY:-${https_proxy:-}}",
            "noProxy": "${NO_PROXY:-${no_proxy:-}}"
          }
        }
      }
      EOF
      fi
    - docker version
    - docker buildx version

.xinyi_desktop_linux:
  extends: .xinyi_package_rules
  image: "node:24-bookworm"
  stage: package
  variables:
    RUSTUP_MAX_RETRIES: "10"
  before_script:
    - chmod +x scripts/ci/gitlab_desktop_package.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - desktop-artifacts/

.xinyi_desktop_macos:
  extends: .xinyi_package_rules
  stage: package
  variables:
    RUSTUP_MAX_RETRIES: "10"
  before_script:
    - chmod +x scripts/ci/gitlab_desktop_package.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - desktop-artifacts/

.xinyi_desktop_windows:
  extends: .xinyi_package_rules
  stage: package
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - desktop-artifacts/

backend:go:
  extends: .xinyi_backend_validation_rules
  image: "golang:1.27.1-bookworm"
  stage: build
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs: []
  script:
    - |
      set -euo pipefail
      if [[ "${MAGISK_LINUX_USE_MIRROR:-true}" == "true" ]]; then
        export GOPROXY="${GOPROXY:-https://goproxy.cn,direct}"
      else
        export GOPROXY="https://proxy.golang.org,direct"
      fi
      cd backend/api
      test -z "$(gofmt -l .)"
      mkdir -p webui_dist
      touch webui_dist/.gitkeep
      go test ./...
      go build ./...

backend:smoke:
  extends:
    - .xinyi_docker
    - .xinyi_backend_validation_rules
  stage: quality
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  variables:
    BASE_URL: "http://docker:8088"
  needs:
    - job: backend:go
      artifacts: false
  script:
    - |
      set -euo pipefail
      docker compose version
      cp backend/.env.example backend/.env
      docker compose -f backend/docker-compose.yml config
      rm -f backend/.env
      chmod +x backend/scripts/smoke_local.sh
      backend/scripts/smoke_local.sh

backend:container:amd64:
  extends:
    - .xinyi_docker
    - .xinyi_backend_publish_rules
  resource_group: xinyi-backend-docker-amd64
  stage: package
  allow_failure: true
  tags:
    - $XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG
  needs:
    - job: backend:go
      artifacts: false
  script:
    - chmod +x scripts/ci/gitlab_backend_container.sh
    - scripts/ci/gitlab_backend_container.sh build-arch-export amd64
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - backend-image-amd64.tar.gz

backend:container:arm64:
  extends:
    - .xinyi_docker
    - .xinyi_backend_publish_rules
  resource_group: xinyi-backend-docker-arm64
  stage: package
  allow_failure: true
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: backend:go
      artifacts: false
  script:
    - chmod +x scripts/ci/gitlab_backend_container.sh
    - scripts/ci/gitlab_backend_container.sh build-arch arm64

backend:container:manifest:
  extends:
    - .xinyi_docker
    - .xinyi_backend_publish_rules
  resource_group: xinyi-backend-docker-manifest
  stage: release-publish
  allow_failure: true
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: backend:container:amd64
      artifacts: true
    - job: backend:container:arm64
      artifacts: false
  script:
    - chmod +x scripts/ci/gitlab_backend_container.sh
    - scripts/ci/gitlab_backend_container.sh publish-arch-archive amd64
    - scripts/ci/gitlab_backend_container.sh publish-manifests
  artifacts:
    reports:
      dotenv: telegram_images.env
    paths:
      - telegram_images.env
    expire_in: 1 day

desktop:linux:x64:
  extends: .xinyi_desktop_linux
  needs: []
  tags:
    - $XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG
  script:
    - scripts/ci/gitlab_desktop_package.sh linux linux-x64 x86_64-unknown-linux-gnu "--target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm" "frontend/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"

desktop:linux:arm64:
  extends: .xinyi_desktop_linux
  needs: []
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  script:
    - scripts/ci/gitlab_desktop_package.sh linux linux-arm64 aarch64-unknown-linux-gnu "--target aarch64-unknown-linux-gnu --bundles appimage,deb,rpm" "frontend/desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle"

desktop:windows:x64:
  extends: .xinyi_desktop_windows
  needs: []
  rules:
    - when: never
  tags:
    - $XINYI_GITLAB_WINDOWS_AMD64_RUNNER_TAG
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/gitlab_desktop_windows.ps1 -ArtifactSuffix windows-x64 -RustTarget x86_64-pc-windows-msvc -BundleArgs "--target x86_64-pc-windows-msvc --bundles nsis" -BundleDir "frontend/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"

desktop:macos:arm64:
  extends: .xinyi_desktop_macos
  needs: []
  rules:
    - if: '$XINYI_GITLAB_MACOS_ENABLED != "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never
  tags:
    - $XINYI_GITLAB_MACOS_ARM64_RUNNER_TAG
  script:
    - scripts/ci/gitlab_desktop_package.sh macos macos-arm64 aarch64-apple-darwin "--target aarch64-apple-darwin --bundles app,dmg" "frontend/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"

desktop:release:gitlab:
  extends: .magisk_linux_base
  stage: release-publish
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab"'
      allow_failure: true
    - when: never
  needs:
    - job: desktop:linux:x64
      artifacts: true
    - job: desktop:linux:arm64
      artifacts: true
  script:
    - chmod +x scripts/release/gitlab_desktop_release.sh
    - scripts/release/gitlab_desktop_release.sh

.xinyi_decode_google_services: &xinyi_decode_google_services |
  set -euo pipefail
  : "${GOOGLE_SERVICES_JSON:?GOOGLE_SERVICES_JSON is required for release builds}"
  mkdir -p app/src/github app/src/githubNoE2ee app/src/githubWithE2ee app/src/play
  printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/github/google-services.json
  printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/githubNoE2ee/google-services.json
  printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/githubWithE2ee/google-services.json
  printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/play/google-services.json

webui:check:
  extends: .xinyi_android_rules
  image: "oven/bun:1.4-alpine"
  stage: quality
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs: []
  cache:
    key:
      files:
        - frontend/webui/package.json
        - frontend/webui/bun.lock
    paths:
      - .bun-cache/
  script:
    - apk add --no-cache bash ca-certificates git
    - export MAGISK_CI_TOOLKIT_DIR="$(bash scripts/resolve_ci_toolkit.sh)"
    - export BUN_CONFIG_REGISTRY="${BUN_CONFIG_REGISTRY:-https://registry.npmmirror.com}"
    - bash "$MAGISK_CI_TOOLKIT_DIR/ci/ensure_bun.sh" frontend/webui/package.json
    - |
      if [ -x "$MAGISK_CI_TOOLKIT_DIR/ci/frontend_build.sh" ]; then
        MAGISK_FRONTEND_DIR="$CI_PROJECT_DIR/frontend/webui" \
          MAGISK_FRONTEND_PACKAGE_JSON="$CI_PROJECT_DIR/frontend/webui/package.json" \
          MAGISK_FRONTEND_INSTALL_COMMAND="bun install --frozen-lockfile --ignore-scripts --cache-dir '$CI_PROJECT_DIR/.bun-cache' --registry '$BUN_CONFIG_REGISTRY'" \
          MAGISK_FRONTEND_LINT_COMMAND="bun run lint" \
          MAGISK_FRONTEND_TYPECHECK_COMMAND="bun run typecheck" \
          MAGISK_FRONTEND_TEST_COMMAND="bun run test" \
          MAGISK_FRONTEND_BUILD_COMMAND="bun run build" \
          MAGISK_FRONTEND_DIST_DIR="$CI_PROJECT_DIR/frontend/webui/dist" \
          bash "$MAGISK_CI_TOOLKIT_DIR/ci/frontend_build.sh"
      else
        cd frontend/webui
        bun install --frozen-lockfile --ignore-scripts --cache-dir "$CI_PROJECT_DIR/.bun-cache" --registry "$BUN_CONFIG_REGISTRY"
        bun run lint
        bun run typecheck
        bun run test
        bun run build
      fi
  artifacts:
    name: "XinyiRelay-webui-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - frontend/webui/dist/

android:build:
  extends:
    - .magisk_android_build
    - .xinyi_signed_android_rules
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - when: never
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:assembleGithubNoE2eeDebug
      :app:assembleGithubWithE2eeDebug
      -PbuildSplits
      -PskipGoogleServices=true
  artifacts:
    name: "XinyiRelay-debug-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/github*/debug/*.apk

android:check:
  extends: .magisk_android_build
  stage: quality
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:compileGithubNoE2eeDebugKotlin
      :app:compileGithubWithE2eeDebugKotlin
      -PskipGoogleServices=true

cancel:older:mr:pipelines:
  extends: .magisk_cancel_older_mr_pipelines

.xinyi_android_test:
  extends:
    - .magisk_android_base
    - .xinyi_android_rules
  stage: quality
  tags:
    - $XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG
  needs: []
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      mapfile -t selected_tasks < <(bash scripts/ci/select_android_test_tasks.sh "$MAGISK_CI_TOOLKIT_DIR")
      if ((${#selected_tasks[@]} == 0)); then
        echo "No Android test tasks selected for this change."
        exit 0
      fi
      bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS \
        "${selected_tasks[@]}" -PskipGoogleServices=true
  artifacts:
    when: always
    expire_in: 14 days

android:test:noe2ee:
  extends: .xinyi_android_test
  artifacts:
    name: "XinyiRelay-test-noe2ee-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - app/build/test-results/testGithubNoE2eeDebugUnitTest/TEST-*.xml
    paths:
      - app/build/reports/kover/htmlGithubNoE2eeDebug/

android:test:withe2ee:
  extends: .xinyi_android_test
  artifacts:
    name: "XinyiRelay-test-withe2ee-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - app/build/test-results/testGithubWithE2eeDebugUnitTest/TEST-*.xml
    paths:
      - app/build/reports/kover/htmlGithubWithE2eeDebug/

android:detekt:
  extends:
    - .magisk_android_detekt
    - .xinyi_android_rules
  stage: quality
  tags:
    - $XINYI_GITLAB_LINUX_AMD64_RUNNER_TAG
  needs: []
  allow_failure: true
  variables:
    MAGISK_ANDROID_DETEKT_TASKS: >-
      detekt
      --continue
      -PskipGoogleServices=true
  artifacts:
    name: "XinyiRelay-detekt-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - merged-sarif/detekt.sarif
      - "**/build/reports/detekt/**"

android:release:guard:
  extends: .magisk_android_release_guard
  stage: release-validate
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs: []

android:release:github-apk:
  # Driven by the shared template. The project only declares what is
  # project-specific: the GitHub flavours and the split flag. Keystore
  # decoding, version resolution and signature validation are the template's
  # job now, and play-release.env carries the version decision downstream so
  # android:release:modules-repo does not have to re-derive it.
  extends: .magisk_android_release_apk
  variables:
    MAGISK_ANDROID_RELEASE_APK_TASKS: ":app:assembleGithubNoE2eeRelease :app:assembleGithubWithE2eeRelease"
    MAGISK_ANDROID_RELEASE_GRADLE_EXTRA_ARGS: "-PbuildSplits"
  before_script:
    - !reference [.magisk_android_base, before_script]
    - *xinyi_decode_google_services
  resource_group: xinyi-android-release-apk
  stage: release-build
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: android:release:guard
      artifacts: false
  artifacts:
    name: "XinyiRelay-release-apks-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/**/release/*.apk
      - app/build/outputs/mapping/**/mapping.txt
      - play-release.env

android:release:play-bundle:
  extends:
    - .magisk_android_base
    - .magisk_android_release_tag_rules
  resource_group: xinyi-android-release-play
  stage: release-build
  tags:
    - $XINYI_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true"'
    - when: never
  needs:
    - job: android:release:guard
      artifacts: false
  variables:
    # Declared so the contract assertion below fails fast if it is ever emptied,
    # mirroring the shared .magisk_android_release_aab template. xinyi cannot use
    # that template directly because it must decode google-services.json first.
    MAGISK_ANDROID_RELEASE_AAB_TASKS: ":app:bundlePlayRelease"
    MAGISK_PLAY_TRACK_OVERRIDE: "production"
  script:
    - *xinyi_decode_google_services
    - |
      set -euo pipefail
      : "${MAGISK_ANDROID_RELEASE_AAB_TASKS:?MAGISK_ANDROID_RELEASE_AAB_TASKS is required (the gradle task list, e.g. ':app:bundlePlayRelease')}"
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      : "${RELEASE_KEYSTORE:?RELEASE_KEYSTORE is required}"
      : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
      : "${KEY_ALIAS:?KEY_ALIAS is required}"
      : "${KEY_PASSWORD:?KEY_PASSWORD is required}"

      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > app/release.jks
      bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
        --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
        --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
        --output "$CI_PROJECT_DIR/play-release.env" \
        --initial-version-code "$MAGISK_PLAY_INITIAL_VERSION_CODE"
      source "$CI_PROJECT_DIR/play-release.env"
      KEYSTORE_FILE="app/release.jks" \
      STORE_PASSWORD="$STORE_PASSWORD" \
      KEY_ALIAS="$KEY_ALIAS" \
      KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS ${MAGISK_ANDROID_RELEASE_AAB_TASKS} \
          -PversionName="$MAGISK_PLAY_VERSION_NAME" -PversionCode="$MAGISK_PLAY_VERSION_CODE"
  artifacts:
    name: "XinyiRelay-release-bundle-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/mapping/**/mapping.txt
      - play-release.env

android:release:gitlab:
