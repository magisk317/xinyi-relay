import org.gradle.api.JavaVersion
import org.gradle.api.artifacts.VersionCatalogsExtension
import org.gradle.api.tasks.testing.Test

def libsCatalog = extensions.getByType(VersionCatalogsExtension).named("libs")
def versionString = { String name -> libsCatalog.findVersion(name).get().requiredVersion }

android {
    compileSdk = versionString("compileSdk").toInteger()
    compileSdkExtension = versionString("compileSdkExtension").toInteger()

    if (!flavorDimensions.contains("distribution")) {
        flavorDimensions += "distribution"
    }

    productFlavors {
        maybeCreate("play").with {
            dimension = "distribution"
            buildConfigField "boolean", "ENABLE_SMS_CHANNEL", "false"
            buildConfigField "boolean", "ALLOW_HTTP_WEBHOOK", "true"
        }
        maybeCreate("github").with {
            dimension = "distribution"
            buildConfigField "boolean", "ENABLE_SMS_CHANNEL", "true"
            buildConfigField "boolean", "ALLOW_HTTP_WEBHOOK", "true"
        }
        maybeCreate("fdroid").with {
            dimension = "distribution"
            buildConfigField "boolean", "ENABLE_SMS_CHANNEL", "true"
            buildConfigField "boolean", "ALLOW_HTTP_WEBHOOK", "false"
        }
    }

    compileOptions {
        def javaVersion = JavaVersion.toVersion(versionString("javaBytecode"))
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
