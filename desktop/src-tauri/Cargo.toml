[package]
name = "xinyi-relay-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1.1" }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-shell = "2.3.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
