<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xinyi Relay Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card card--control">
        <p class="eyebrow">Xinyi Relay</p>
        <h1>Desktop Console</h1>
        <p class="subtitle">Keep the backend address locally, embed the remote console below, or jump out to the system browser when needed.</p>

        <label class="field">
          <span>Backend URL</span>
          <input id="backend-url" type="url" placeholder="https://localhost:8443" />
        </label>

        <div class="actions">
          <button id="save-btn" class="primary">Save</button>
          <button id="embed-btn">Load Embedded Console</button>
          <button id="open-btn">Open In Browser</button>
        </div>

        <p id="status" class="status">Ready</p>
      </section>

      <section class="card card--viewer">
        <div class="viewer-head">
          <div>
            <p class="eyebrow">Remote View</p>
            <h2>Embedded Console</h2>
          </div>
          <div id="viewer-url" class="viewer-url">Not connected</div>
        </div>
        <div class="viewer-shell">
          <iframe id="console-frame" title="Xinyi Relay Remote Console"></iframe>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
  </html>
