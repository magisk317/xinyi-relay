version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    target-branch: "beta"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
      compose:
        patterns:
          - "androidx.compose*:*"
      androidx:
        patterns:
          - "androidx.*:*"
        exclude-patterns:
          - "androidx.compose*:*"
      networking:
        patterns:
          - "com.squareup.okhttp3:*"
          - "com.squareup.retrofit2:*"
          - "io.netty:*"
          - "org.apache.httpcomponents:*"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    target-branch: "beta"
    commit-message:
      prefix: "ci(deps)"
    groups:
      all-actions:
        patterns:
          - "*"
