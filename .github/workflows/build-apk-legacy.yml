name: Build APK (legacy transition)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  LEGACY_BASE_REF: "6380250"

jobs:
  build-legacy-apk:
    name: Build Legacy APKs
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - name: Checkout Legacy Baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ env.LEGACY_BASE_REF }}
          path: legacy-src
          fetch-depth: 0

      - name: set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x legacy-src/gradlew

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > legacy-src/app/release.jks

      - name: Validate release metadata on legacy baseline
        run: |
          chmod +x legacy-src/scripts/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            legacy-src/scripts/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            legacy-src/scripts/check_release_guard.sh
          fi

      - name: Build Legacy APKs with Splits
        run: ./gradlew assembleGithubRelease -PbuildSplits
        working-directory: legacy-src
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect Legacy APK Assets
        run: |
          mkdir -p artifacts/legacy-apks
          shopt -s nullglob
          for apk in legacy-src/app/build/outputs/apk/github/release/*.apk; do
            base="$(basename "$apk" .apk)"
            cp "$apk" "artifacts/legacy-apks/${base}-legacy.apk"
          done

      - name: Upload Legacy APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-legacy
          path: artifacts/legacy-apks/*.apk

  publish-legacy-assets:
    name: Publish Legacy Assets
    needs: [build-legacy-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Legacy APK Artifacts
        uses: actions/download-artifact@v8
        with:
          name: apks-legacy
          path: artifacts/legacy-apks

      - name: Upload legacy assets to release (non-public transition)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "WARN: GH_PAT is empty, skip legacy release attachment."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/legacy-apks/*.apk --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$TAG" artifacts/legacy-apks/*.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$TAG" \
              --draft \
              --notes "Legacy transition package only. Not for public Play track."
          fi
