# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow performs a static analysis of your Kotlin source code using
# Detekt.
#
# Scans are triggered:
# 1. On every push to default and protected branches
# 2. On every Pull Request targeting the default branch
# 3. On a weekly schedule
# 4. Manually, on demand, via the "workflow_dispatch" event
#
# The workflow should work with no modifications, but you might like to use a
# later version of the Detekt CLI by modifying the $DETEKT_RELEASE_TAG
# environment variable.
name: Scan with Detekt

on:
  # Triggers the workflow on push or pull request events but only for default and protected branches
  push:
    branches: [ "beta" ]
  pull_request:
    branches: [ "beta" ]
  schedule:
     - cron: '0 0 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      security-events: write
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'

      - name: Run Detekt
        continue-on-error: true
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: detekt --continue

      - name: Merge SARIF files
        id: merge_sarif
        if: always()
        run: |
          mkdir -p merged-sarif
          mapfile -t sarif_files < <(find . -path '*/build/reports/detekt/detekt.sarif' -type f | sort)
          if (( ${#sarif_files[@]} == 0 )); then
            echo "No SARIF files found"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "${sarif_files[@]}" <<'PY'
          import json
          import sys
          from pathlib import Path

          inputs = [Path(path) for path in sys.argv[1:]]
          merged = None
          merged_runs = []

          for path in inputs:
              data = json.loads(path.read_text())
              if merged is None:
                  merged = data
                  merged["runs"] = []
              merged_runs.extend(data.get("runs") or [])

          if merged is None:
              raise SystemExit("No SARIF inputs")

          merged["runs"] = merged_runs
          Path("merged-sarif/detekt.sarif").write_text(json.dumps(merged))
          PY
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Upload merged SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.merge_sarif.outputs.exists == 'true'
        continue-on-error: true
        with:
          sarif_file: merged-sarif/detekt.sarif
          category: app
