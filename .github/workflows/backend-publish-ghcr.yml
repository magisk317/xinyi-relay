name: Publish Backend Container

on:
  workflow_dispatch:
  push:
    branches:
      - beta
    tags:
      - "v*.*.*"
    paths:
      - "frontend/webui/**"
      - "frontend/shared/**"
      - "backend/**"
      - "backend/api/Dockerfile"
      - ".github/workflows/backend-publish-ghcr.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare backend publish
    runs-on: ubuntu-26.04
    outputs:
      ghcr_image: ${{ steps.vars.outputs.ghcr_image }}
      tags_json: ${{ steps.vars.outputs.tags_json }}
      release_kind: ${{ steps.vars.outputs.release_kind }}
      release_tag: ${{ steps.vars.outputs.release_tag }}
      release_version: ${{ steps.vars.outputs.release_version }}
      release_title: ${{ steps.vars.outputs.release_title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: backend/api/go.sum

      - name: Go test
        working-directory: backend/api
        run: |
          mkdir -p webui_dist
          touch webui_dist/.gitkeep
          go test ./...

      - name: Derive publish targets
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          eval "$(bash scripts/release/release_ref.sh parse-ref "${GITHUB_REF_TYPE}" "${GITHUB_REF_NAME}")"

          ghcr_image="ghcr.io/${GITHUB_REPOSITORY}-backend"

          tags=()
          if [[ "$release_kind" == "beta" ]]; then
            tags+=("beta")
          elif [[ "$release_kind" == "full" ]]; then
            tags+=("${release_version}" "latest")
          else
            echo "Unsupported release kind for backend publish: $release_kind" >&2
            exit 1
          fi

          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "Unsupported ref for backend publish: $GITHUB_REF" >&2
            exit 1
          fi

          {
            echo "ghcr_image=$ghcr_image"
            echo "release_kind=$release_kind"
            echo "release_tag=$release_tag"
            echo "release_version=$release_version"
            echo "release_title<<EOF"
            echo "$release_title"
            echo "EOF"
            printf 'tags_json=%s\n' "$(printf '%s\n' "${tags[@]}" | jq -R . | jq -sc .)"
          } >> "$GITHUB_OUTPUT"

  build_amd64:
    name: Build backend image (amd64)
    needs: prepare
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        shell: bash
        env:
          GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
        run: |
          set -euo pipefail

          image_tags=()
          while IFS= read -r tag; do
            image_tags+=("${GHCR_IMAGE}:${tag}-amd64")
          done < <(jq -r '.[]' <<<"$TAGS_JSON")

          {
            echo "tags<<EOF"
            printf '%s\n' "${image_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/api/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=xinyi-relay-backend
            org.opencontainers.image.description=Remote backend for Xinyi Relay
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          cache-from: type=gha,scope=backend-image-amd64
          cache-to: type=gha,mode=max,scope=backend-image-amd64

  build_arm64:
    name: Build backend image (arm64)
    needs: prepare
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        shell: bash
        env:
          GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
        run: |
          set -euo pipefail

          image_tags=()
          while IFS= read -r tag; do
            image_tags+=("${GHCR_IMAGE}:${tag}-arm64")
          done < <(jq -r '.[]' <<<"$TAGS_JSON")

          {
            echo "tags<<EOF"
            printf '%s\n' "${image_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/api/Dockerfile
          push: true
          provenance: false
          platforms: linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=xinyi-relay-backend
            org.opencontainers.image.description=Remote backend for Xinyi Relay
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          cache-from: type=gha,scope=backend-image-arm64
          cache-to: type=gha,mode=max,scope=backend-image-arm64

  publish_manifests:
    name: Publish multi-arch manifests
    needs:
      - prepare
      - build_amd64
      - build_arm64
    runs-on: ubuntu-26.04
    outputs:
      dockerhub_published: ${{ steps.dockerhub_mirror.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve CI toolkit
        run: bash scripts/resolve_ci_toolkit.sh >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive Docker Hub target (optional)
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_ENABLED=1" >> "$GITHUB_ENV"
            if [ -n "${{ secrets.DOCKERHUB_IMAGE }}" ]; then
              echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_IMAGE }}" >> "$GITHUB_ENV"
            else
              echo "DOCKERHUB_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/xinyi-relay-backend" >> "$GITHUB_ENV"
            fi
          else
            echo "DOCKERHUB_ENABLED=0" >> "$GITHUB_ENV"
            echo "DOCKERHUB_IMAGE=" >> "$GITHUB_ENV"
          fi

      - name: Publish GHCR multi-arch manifests
        shell: bash
        env:
          GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "${GHCR_IMAGE}:${tag}" \
              "${GHCR_IMAGE}:${tag}-amd64" \
              "${GHCR_IMAGE}:${tag}-arm64"
            docker buildx imagetools inspect "${GHCR_IMAGE}:${tag}"
          done < <(jq -r '.[]' <<<"$TAGS_JSON")

      - name: Mirror manifests to Docker Hub (optional)
        id: dockerhub_mirror
        if: env.DOCKERHUB_ENABLED == '1' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        shell: bash
        env:
          MAGISK_SOURCE_REGISTRY: ghcr.io
          MAGISK_SOURCE_USERNAME: ${{ github.actor }}
          MAGISK_SOURCE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          MAGISK_SOURCE_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
          MAGISK_TARGET_REGISTRY: docker.io
          MAGISK_TARGET_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          MAGISK_TARGET_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          MAGISK_TARGET_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
        run: |
          set -euo pipefail
          MAGISK_CONTAINER_TAGS="$(jq -r '.[]' <<<"$TAGS_JSON")"
          export MAGISK_CONTAINER_TAGS
          bash .magisk-ci-toolkit/ci/container_mirror.sh mirror



  notify_telegram:
    name: Notify Telegram
    if: ${{ needs.build_amd64.result == 'success' && needs.build_arm64.result == 'success' && needs.publish_manifests.result == 'success' }}
    needs:
      - prepare
      - build_amd64
      - build_arm64
      - publish_manifests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve CI toolkit
        run: bash scripts/resolve_ci_toolkit.sh >/dev/null

      - name: Send Telegram notification
        env:
          GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE_OVERRIDE: ${{ secrets.DOCKERHUB_IMAGE }}
          DOCKERHUB_PUBLISH_OK: ${{ needs.publish_manifests.outputs.dockerhub_published }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_GROUP: ${{ secrets.TELEGRAM_TO_GROUP }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          AMD64_RESULT: ${{ needs.build_amd64.result }}
          ARM64_RESULT: ${{ needs.build_arm64.result }}
          MANIFEST_RESULT: ${{ needs.publish_manifests.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_TOKEN:-}" || -z "${TELEGRAM_TO_GROUP:-}" ]]; then
            echo "Telegram secrets not configured, skip notification."
            exit 0
          fi

          PROJECT_TAG="📌 #XinyiRelay"

          dockerhub_enabled=0
          dockerhub_image=""
          if [[ "$DOCKERHUB_PUBLISH_OK" == "true" && -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            dockerhub_enabled=1
            if [[ -n "$DOCKERHUB_IMAGE_OVERRIDE" ]]; then
              dockerhub_image="$DOCKERHUB_IMAGE_OVERRIDE"
            else
              dockerhub_image="docker.io/${DOCKERHUB_USERNAME}/xinyi-relay-backend"
            fi
          fi

          MAGISK_CONTAINER_TAGS="$(jq -r '.[]' <<<"$TAGS_JSON")"
          export MAGISK_CONTAINER_TAGS
          images_block="$(
            MAGISK_PRIMARY_IMAGE="$GHCR_IMAGE" \
            MAGISK_OPTIONAL_IMAGE="$dockerhub_image" \
            MAGISK_OPTIONAL_PUBLISHED="$dockerhub_enabled" \
              bash .magisk-ci-toolkit/ci/container_mirror.sh list | sed 's/^/  - /'
          )"
          if [[ -z "$images_block" ]]; then
            images_block="  - ${GHCR_IMAGE}:<unresolved>"
          fi

          message="$(cat <<EOF
          ✅ XinyiRelay：backend-publish-ghcr
          ${PROJECT_TAG}

          📦 Release: ${RELEASE_VERSION:-${{ github.ref_name }}}
          📚 Repo: ${{ github.repository }}
          🧩 Commit: ${{ github.sha }}
          ⚙️ Workflow: backend-publish-ghcr
          📊 Results:
            - amd64: ${AMD64_RESULT}
            - arm64: ${ARM64_RESULT}
            - manifests: ${MANIFEST_RESULT}
          🐳 Images:
          ${images_block}
          🔗 Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

          curl_args=(
            -fSs
            -X POST
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
            -d "chat_id=${TELEGRAM_TO_GROUP}"
            --data-urlencode "text=${message}"
          )
          if [[ -n "${TELEGRAM_TOPIC_ID:-}" ]]; then
            curl_args+=(-d "message_thread_id=${TELEGRAM_TOPIC_ID}")
          fi
          curl "${curl_args[@]}"
