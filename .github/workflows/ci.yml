name: CI
permissions:
  packages: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: workflow_dispatch

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-26.04
    # Every job needs a ceiling. XposedSmsCode ran a hung test job for 4.8 hours because
    # nothing in its workflow could stop it; this repository had the same gap.
    timeout-minutes: 45
    if: github.actor != 'dependabot[bot]'
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
      HAS_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
        with:
          ref: 98f215a0ef887a22090eee5d287b98e4ed862ae3
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          # The toolkit defaults to 26, but this project targets 27 (see
          # gradle/libs.versions.toml: java / javaBytecode). Lint refuses to run on
          # a JVM older than the target, and GitLab never sees that because its
          # runner image already ships 27 -- only a GitHub-hosted runner does.
          java-version: '27'
      - name: Set up Bun
        shell: bash
        run: |
          set -euo pipefail
          bash .magisk-ci-toolkit/ci/ensure_bun.sh frontend/webui/package.json
          echo "BUN_INSTALL_CACHE_DIR=${RUNNER_TEMP}/bun-cache" >> "$GITHUB_ENV"
      - name: WebUI Install
        working-directory: frontend/webui
        run: bun install --frozen-lockfile --ignore-scripts --cache-dir "$RUNNER_TEMP/bun-cache"
      - name: WebUI Lint + Typecheck + Test + Build
        working-directory: frontend/webui
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
      - name: Require release signing
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "::error::Release signing is unavailable (RELEASE_KEYSTORE / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD). The Android build and upload steps below are gated on it, so without this the job would report success while producing no APK at all."
          exit 1
      - name: Decode Keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.jks
      - name: Decode Google Services
        if: env.HAS_GOOGLE_SERVICES_JSON == 'true'
        run: |
          mkdir -p app/src/github app/src/play
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/github/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/play/google-services.json
      - name: Test
        shell: bash
        # Test results feed code changes afterwards; they do not gate the build. This step
        # sits inside the job that compiles and uploads the APKs, so without the flag a
        # single failing test would have skipped every later step, including the artifacts.
        continue-on-error: true
        run: |
          set -euo pipefail
          # Command substitution, not `mapfile < <(...)`: the process-substitution form
          # discards the selector's exit status, so a dead selector would leave an empty
          # array, print "no tasks selected" and report a green job that ran nothing.
          if ! selected="$(
            python3 "${MAGISK_CI_TOOLKIT_DIR:-.magisk-ci-toolkit}/ci/select_gradle_tasks.py" \
              --root "$PWD" \
              --toolkit "${MAGISK_CI_TOOLKIT_DIR:-.magisk-ci-toolkit}" \
              --config scripts/config/android-test-tasks.json
          )"; then
            echo "::error::the test task selector failed; refusing to report a passing job with no tests"
            exit 1
          fi
          mapfile -t selected_tasks <<< "$selected"
          if [[ ${#selected_tasks[@]} -eq 0 || -z "${selected_tasks[0]}" ]]; then
            echo "No Android test tasks selected for this change."
            exit 0
          fi
          printf 'selected tasks: %s\n' "${selected_tasks[*]}"
          # In-shell budget rather than timeout-minutes, so a stall is a step failure that
          # continue-on-error can absorb; a runner-side job timeout reports the job as
          # cancelled, which the flag does not swallow.
          rc=0
          timeout --kill-after=60s 25m bash "${MAGISK_CI_TOOLKIT_DIR:-.magisk-ci-toolkit}/gradle/run_gradle_with_retry.sh" \
            --warning-mode all "${selected_tasks[@]}" \
            -PskipGoogleServices=${{ env.HAS_GOOGLE_SERVICES_JSON == 'false' }} || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::warning::tests exceeded their 25m budget (exit $rc). The job continues by policy, but this is not a passing test run."
          fi
          exit "$rc"
      - name: Build signed debug APKs
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: >
            --warning-mode all
            app:assembleGithubDebug
            -PbuildSplits
            -PminifyDebug
            -PskipGoogleServices=${{ env.HAS_GOOGLE_SERVICES_JSON == 'false' }}
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Write build summary
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done < <(find app/build/outputs/apk -path '*/debug/*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Debug APK - GitHub arm64-v8a
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-arm64-v8a
          path: app/build/outputs/apk/github*/debug/*arm64-v8a*.apk
      - name: Upload Debug APK - GitHub armeabi-v7a
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-armeabi-v7a
          path: app/build/outputs/apk/github*/debug/*armeabi-v7a*.apk
      - name: Upload Debug APK - GitHub x86
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-x86
          path: app/build/outputs/apk/github*/debug/*x86_[!6]*.apk
      - name: Upload Debug APK - GitHub x86_64
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-x86_64
          path: app/build/outputs/apk/github*/debug/*x86_64*.apk
      - name: Upload Debug APK - GitHub universal
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-universal
          path: app/build/outputs/apk/github*/debug/*universal*.apk
      - name: Upload Kover Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: |
            app/build/reports/kover/htmlGithubDebug
