name: CI
permissions:
  contents: read

on:
  pull_request:
    branches:
      - beta
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      HAS_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve WebUI toolchain
        id: webui_toolchain
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          package_json = json.loads(Path("webui/package.json").read_text())
          node_version = package_json.get("engines", {}).get("node")
          package_manager = package_json.get("packageManager", "")
          if not node_version:
              raise SystemExit("webui/package.json is missing engines.node")
          if not package_manager.startswith("pnpm@"):
              raise SystemExit("webui/package.json must declare packageManager as pnpm@<version>")
          print(f"node_version={node_version}")
          print(f"pnpm_version={package_manager.split('@', 1)[1]}")
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.webui_toolchain.outputs.node_version }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.webui_toolchain.outputs.pnpm_version }}
      - name: WebUI Install
        run: pnpm -C webui install --frozen-lockfile
      - name: WebUI Lint + Typecheck + Build
        run: |
          pnpm -C webui lint
          pnpm -C webui typecheck
          pnpm -C webui build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks
      - name: Decode Google Services
        if: env.HAS_GOOGLE_SERVICES_JSON == 'true'
        run: |
          mkdir -p app/src/github app/src/play
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/github/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/play/google-services.json
      - name: Build & Test
        run: >
          bash scripts/with_workspace_gradle_lock.sh --warning-mode all
          app:assembleGithubApi101Debug
          app:assembleGithubLegacyDebug
          app:testGithubApi101DebugUnitTest
          app:testGithubLegacyDebugUnitTest
          :app:koverVerifyGithubApi101Debug
          :app:koverHtmlReportGithubApi101Debug
          -PallowIncompatibleDebugSigning=true
          -PbuildSplits
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done < <(find app/build/outputs/apk -path '*/debug/*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Debug APK - GitHub Api101 arm64-v8a
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-api101-arm64-v8a
          path: app/build/outputs/apk/githubApi101/debug/arm64-v8a_api101_*.apk
      - name: Upload Debug APK - GitHub Api101 armeabi-v7a
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-api101-armeabi-v7a
          path: app/build/outputs/apk/githubApi101/debug/armeabi-v7a_api101_*.apk
      - name: Upload Debug APK - GitHub Api101 x86
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-api101-x86
          path: app/build/outputs/apk/githubApi101/debug/x86_api101_*.apk
      - name: Upload Debug APK - GitHub Api101 x86_64
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-api101-x86_64
          path: app/build/outputs/apk/githubApi101/debug/x86_64_api101_*.apk
      - name: Upload Debug APK - GitHub Api101 universal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-api101-universal
          path: app/build/outputs/apk/githubApi101/debug/universal_api101_*.apk
      - name: Upload Debug APK - GitHub Legacy arm64-v8a
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-legacy-arm64-v8a
          path: app/build/outputs/apk/githubLegacy/debug/arm64-v8a_legacy_*.apk
      - name: Upload Debug APK - GitHub Legacy armeabi-v7a
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-legacy-armeabi-v7a
          path: app/build/outputs/apk/githubLegacy/debug/armeabi-v7a_legacy_*.apk
      - name: Upload Debug APK - GitHub Legacy x86
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-legacy-x86
          path: app/build/outputs/apk/githubLegacy/debug/x86_legacy_*.apk
      - name: Upload Debug APK - GitHub Legacy x86_64
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-legacy-x86_64
          path: app/build/outputs/apk/githubLegacy/debug/x86_64_legacy_*.apk
      - name: Upload Debug APK - GitHub Legacy universal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-legacy-universal
          path: app/build/outputs/apk/githubLegacy/debug/universal_legacy_*.apk
      - name: Upload Kover Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: app/build/reports/kover/htmlGithubApi101Debug
