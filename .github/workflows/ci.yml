name: CI
permissions:
  packages: read
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - beta
  push:
    branches:
      - beta
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      HAS_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve CI toolkit
        run: bash scripts/resolve_ci_toolkit.sh
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
      - name: Resolve WebUI toolchain
        id: webui_toolchain
        shell: bash
        run: python scripts/ci/resolve_package_toolchain.py frontend/webui/package.json --require-node >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.webui_toolchain.outputs.node_version }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.webui_toolchain.outputs.pnpm_version }}
      - name: WebUI Install
        run: pnpm -C frontend/webui install --frozen-lockfile --ignore-scripts
      - name: WebUI Lint + Typecheck + Test + Build
        run: |
          pnpm -C frontend/webui lint
          pnpm -C frontend/webui typecheck
          pnpm -C frontend/webui test
          pnpm -C frontend/webui build
      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks
      - name: Decode Google Services
        if: env.HAS_GOOGLE_SERVICES_JSON == 'true'
        run: |
          mkdir -p app/src/github app/src/githubNoE2ee app/src/githubWithE2ee app/src/play
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/github/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/githubNoE2ee/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/githubWithE2ee/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/play/google-services.json
      - name: Build & Test
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: >
            --warning-mode all
            app:assembleGithubNoE2eeDebug app:assembleGithubWithE2eeDebug
            app:testGithubNoE2eeDebugUnitTest app:testGithubWithE2eeDebugUnitTest
            :app:koverHtmlReportGithubNoE2eeDebug :app:koverHtmlReportGithubWithE2eeDebug
            verifyStructureBoundaries
            -PallowIncompatibleDebugSigning=true
            -PbuildSplits
            -PskipGoogleServices=${{ env.HAS_GOOGLE_SERVICES_JSON == 'false' }}
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done < <(find app/build/outputs/apk -path '*/debug/*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Debug APK - GitHub arm64-v8a
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-arm64-v8a
          path: app/build/outputs/apk/github*/debug/*arm64-v8a*.apk
      - name: Upload Debug APK - GitHub armeabi-v7a
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-armeabi-v7a
          path: app/build/outputs/apk/github*/debug/*armeabi-v7a*.apk
      - name: Upload Debug APK - GitHub x86
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-x86
          path: app/build/outputs/apk/github*/debug/*x86*.apk
      - name: Upload Debug APK - GitHub x86_64
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-x86_64
          path: app/build/outputs/apk/github*/debug/*x86_64*.apk
      - name: Upload Debug APK - GitHub universal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XinyiRelay-debug-github-universal
          path: app/build/outputs/apk/github*/debug/*universal*.apk
      - name: Upload Kover Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: |
            app/build/reports/kover/htmlGithubNoE2eeDebug
            app/build/reports/kover/htmlGithubWithE2eeDebug
