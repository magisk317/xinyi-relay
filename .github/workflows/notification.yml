name: Telegram Notification

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Send Notification
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "TG_BOT_TOKEN not set, skip."
            exit 0
          fi
          THREAD_PARAM_MSG=""
          THREAD_PARAM_DOC=""
          if [ -n "$TG_THREAD_ID" ]; then
            THREAD_PARAM_MSG="-d message_thread_id=$TG_THREAD_ID"
            THREAD_PARAM_DOC="-F message_thread_id=$TG_THREAD_ID"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME:-manual}"
          fi

          WHATSNEW_FILE="distribution/whatsnew/whatsnew-zh-CN"
          if [ -f "$WHATSNEW_FILE" ]; then
            WHATSNEW_CONTENT="$(cat "$WHATSNEW_FILE")"
          else
            WHATSNEW_CONTENT="Release notes file not found: $WHATSNEW_FILE"
          fi

          CAPTION=$(printf '📦 信驿 Relay Release: %s\n\n%s' "$RELEASE_TAG" "$WHATSNEW_CONTENT")

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            $THREAD_PARAM_MSG \
            --data-urlencode "text=${CAPTION}" \
            -d "disable_web_page_preview=true"

