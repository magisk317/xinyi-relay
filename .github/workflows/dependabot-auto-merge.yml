name: Dependency PR Auto Merge

on:
  pull_request:
    branches:
      - beta

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.base.ref == 'beta' &&
      (
        github.event.pull_request.user.login == 'github-actions[bot]' ||
        (
          github.event.pull_request.user.login == 'magisk317' &&
          (
            startsWith(github.head_ref, 'renovate/') ||
            startsWith(github.head_ref, 'chore/dependency-force')
          )
        )
      )
    steps:
      - name: Enable auto-merge for dependency PRs
        run: gh pr merge --auto --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}
