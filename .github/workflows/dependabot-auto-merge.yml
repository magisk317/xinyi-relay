name: Dependabot Auto Merge

on:
  pull_request:
    branches:
      - beta

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.base.ref == 'beta' &&
      contains(fromJson('["dependabot[bot]","app/dependabot","renovate[bot]","app/renovate","github-actions[bot]","magisk317"]'), github.event.pull_request.user.login)
    steps:
      - name: Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'app/dependabot'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          skip-commit-verification: true

      - name: Enable auto-merge for Dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'app/dependabot'
        run: gh pr merge --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Renovate PRs
        if: github.event.pull_request.user.login == 'renovate[bot]' || github.event.pull_request.user.login == 'app/renovate'
        run: gh pr merge --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for GitHub Actions or magisk317 PRs
        if: github.event.pull_request.user.login == 'github-actions[bot]' || github.event.pull_request.user.login == 'magisk317'
        run: gh pr merge --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
