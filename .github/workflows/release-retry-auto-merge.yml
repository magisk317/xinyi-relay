name: Release Retry Auto Merge

# Manual-only by policy (2026-10-25): automatic triggers are removed so this file
# can never start on its own. Release automation is driven from the project's
# primary CI host; runs on this mirror are operator-initiated, and the inputs
# below are the only way any publishing step turns on.
on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Operator note recorded with the run (this file has no automatic trigger anymore)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-26.04
    if: |
      github.event.pull_request.base.ref == 'beta' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'chore/release-versioncode-') &&
      startsWith(github.event.pull_request.title, 'chore(release): bump versionCode for ')
    steps:
      - name: Enable auto-merge for release retry PR
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
