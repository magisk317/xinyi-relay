name: Dependabot Auto Recreate

on:
  # Trigger when a PR is closed (including merged)
  pull_request_target:
    types: [closed]
    branches:
      - beta
  
  # Support manual trigger
  workflow_dispatch:

jobs:
  auto-recreate:
    # Only run when a Dependabot PR is merged
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      
    steps:
      - name: Find and Recreate Dependabot PRs
        uses: actions/github-script@v9
        with:
          script: |
            console.log('Checking for Dependabot PRs that need recreation...');
            
            // Get all open PRs
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            // Filter for Dependabot PRs
            const dependabotPRs = pullRequests.filter(pr => 
              pr.user.login === 'dependabot[bot]'
            );
            
            console.log(`Found ${dependabotPRs.length} Dependabot PR(s)`);
            
            if (dependabotPRs.length === 0) {
              console.log('No Dependabot PRs to process');
              return;
            }
            
            // Trigger recreate for each PR behind beta
            for (const pr of dependabotPRs) {
              try {
                console.log(`Processing PR #${pr.number}: ${pr.title}`);
                
                // Check if PR is behind base branch
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: pr.head.sha,
                  head: pr.base.ref
                });
                
                if (comparison.behind_by > 0) {
                  console.log(`  PR #${pr.number} is ${comparison.behind_by} commit(s) behind, triggering recreate`);
                  
                  // Trigger recreate by commenting
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: '@dependabot recreate'
                  });
                  
                  // Avoid rate limiting
                  await new Promise(resolve => setTimeout(resolve, 2000));
                } else {
                  console.log(`  PR #${pr.number} is up-to-date, skipping`);
                }
              } catch (error) {
                console.error(`Error processing PR #${pr.number}:`, error.message);
              }
            }
            
            console.log('Completed processing all Dependabot PRs');
