name: Desktop CI

on:
  pull_request:
    branches:
      - beta
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches:
      - beta
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  tauri-linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            pkg-config

      - name: Install desktop npm dependencies
        run: |
          cd desktop
          npm ci

      - name: Build desktop frontend
        run: |
          cd desktop
          npm run build

      - name: Tauri Linux check
        env:
          PKG_CONFIG: /usr/bin/pkg-config
        run: |
          cd desktop
          npm run tauri:check:linux
