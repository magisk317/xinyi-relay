name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*.*.*"
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.job_label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            job_label: Linux-x64
            os_name: linux
            arch_name: x64
            rust_target: x86_64-unknown-linux-gnu
            bundle_args: "--target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm"
            bundle_dir: desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          - runner: ubuntu-24.04-arm
            job_label: Linux-arm64
            os_name: linux
            arch_name: arm64
            rust_target: aarch64-unknown-linux-gnu
            bundle_args: "--target aarch64-unknown-linux-gnu --bundles appimage,deb,rpm"
            bundle_dir: desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle
          - runner: windows-latest
            job_label: Windows-x86
            os_name: windows
            arch_name: x86
            rust_target: i686-pc-windows-msvc
            bundle_args: "--target i686-pc-windows-msvc --bundles nsis,msi"
            bundle_dir: desktop/src-tauri/target/i686-pc-windows-msvc/release/bundle
          - runner: windows-latest
            job_label: Windows-x64
            os_name: windows
            arch_name: x64
            rust_target: x86_64-pc-windows-msvc
            bundle_args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"
            bundle_dir: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          - runner: windows-11-arm
            job_label: Windows-arm64
            os_name: windows
            arch_name: arm64
            rust_target: aarch64-pc-windows-msvc
            bundle_args: "--target aarch64-pc-windows-msvc --bundles nsis,msi"
            bundle_dir: desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle
          - runner: macos-15-intel
            job_label: macOS-intel
            os_name: macos
            arch_name: intel
            rust_target: x86_64-apple-darwin
            bundle_args: "--target x86_64-apple-darwin --bundles app,dmg"
            bundle_dir: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle
          - runner: macos-latest
            job_label: macOS-arm64
            os_name: macos
            arch_name: apple-silicon
            rust_target: aarch64-apple-darwin
            bundle_args: "--target aarch64-apple-darwin --bundles app,dmg"
            bundle_dir: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux desktop dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            pkg-config

      - name: Install desktop npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build

      - name: Build desktop bundles
        working-directory: desktop
        env:
          PKG_CONFIG: ${{ matrix.os_name == 'linux' && '/usr/bin/pkg-config' || '' }}
          TAURI_LINUX_AYATANA_APPINDICATOR: ${{ matrix.os_name == 'linux' && '1' || '' }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri:build -- ${{ matrix.bundle_args }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: xinyi-relay-desktop-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: |
            ${{ matrix.bundle_dir }}/**/*.AppImage
            ${{ matrix.bundle_dir }}/**/*.deb
            ${{ matrix.bundle_dir }}/**/*.rpm
            ${{ matrix.bundle_dir }}/**/*.msi
            ${{ matrix.bundle_dir }}/**/*.exe
            ${{ matrix.bundle_dir }}/**/*.app
            ${{ matrix.bundle_dir }}/**/*.dmg

      - name: Publish desktop bundles to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          eval "$(bash scripts/release_ref.sh parse-ref "${GITHUB_REF_TYPE}" "${GITHUB_REF_NAME}")"

          mapfile -d '' release_assets < <(
            find "${{ matrix.bundle_dir }}" -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' -o -name '*.app' -o -name '*.dmg' \) \
              -print0 | sort -z
          )
          if [[ ${#release_assets[@]} -eq 0 ]]; then
            echo "ERROR: no desktop release assets found" >&2
            find "${{ matrix.bundle_dir }}" -type f | sort >&2 || true
            exit 1
          fi

          if [[ "$release_kind" == "full" ]]; then
            for attempt in $(seq 1 60); do
              if gh release view "$release_tag" >/dev/null 2>&1; then
                break
              fi
              echo "Waiting for full release $release_tag to be created by APK workflow ($attempt/60)..."
              sleep 20
            done
            gh release view "$release_tag" >/dev/null 2>&1 || {
              echo "ERROR: full release $release_tag was not created in time" >&2
              exit 1
            }
            gh release upload "$release_tag" "${release_assets[@]}" --clobber
            exit 0
          fi

          release_notes="Desktop bundles for ${release_version}."
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${release_assets[@]}" --clobber
            gh release edit "$release_tag" --title "$release_title"
          else
            if ! gh release create "$release_tag" "${release_assets[@]}" \
              --draft \
              --title "$release_title" \
              --verify-tag \
              --generate-notes \
              --notes "$release_notes"; then
              gh release upload "$release_tag" "${release_assets[@]}" --clobber
              gh release edit "$release_tag" --title "$release_title"
            fi
          fi
