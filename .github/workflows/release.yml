name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Semantic version tag, e.g. v3.1.4
  workflow_dispatch:

permissions:
  packages: read
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  validate-release:
    name: Validate Release Metadata
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            scripts/check_release_guard.sh
          fi

  build-github-apk:
    name: Build GitHub APK
    needs: [validate-release]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      HAS_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve WebUI toolchain
        id: webui_toolchain
        shell: bash
        run: python scripts/ci/resolve_package_toolchain.py frontend/webui/package.json --require-node >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.webui_toolchain.outputs.node_version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.webui_toolchain.outputs.pnpm_version }}

      - name: Install WebUI dependencies
        run: pnpm -C frontend/webui install --frozen-lockfile --ignore-scripts

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Decode Google Services
        if: env.HAS_GOOGLE_SERVICES_JSON == 'true'
        run: |
          mkdir -p app/src/github app/src/githubNoE2ee app/src/githubWithE2ee app/src/play
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/github/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/githubNoE2ee/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/githubWithE2ee/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/play/google-services.json

      - name: Build GitHub APK with Splits
        run: >
          ./gradlew
          assembleGithubNoE2eeRelease assembleGithubWithE2eeRelease
          -PbuildSplits
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-github
          path: app/build/outputs/apk/**/release/*.apk

      - name: Detect GitHub Native Symbols
        id: github_symbols
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/build/outputs/native-debug-symbols/github*Release/native-debug-symbols.zip)
          if (( ${#files[@]} == 0 )); then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Native Symbols Artifact
        if: steps.github_symbols.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: native-symbols-github
          path: ${{ steps.github_symbols.outputs.paths }}

  build-aab:
    name: Build Bundle
    needs: [validate-release]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    outputs:
      has_play_native_symbols: ${{ steps.play_symbols.outputs.exists }}
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      HAS_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve WebUI toolchain
        id: webui_toolchain
        shell: bash
        run: python scripts/ci/resolve_package_toolchain.py frontend/webui/package.json --require-node >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.webui_toolchain.outputs.node_version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.webui_toolchain.outputs.pnpm_version }}

      - name: Install WebUI dependencies
        run: pnpm -C frontend/webui install --frozen-lockfile --ignore-scripts

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Decode Google Services
        if: env.HAS_GOOGLE_SERVICES_JSON == 'true'
        run: |
          mkdir -p app/src/github app/src/githubNoE2ee app/src/githubWithE2ee app/src/play
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/github/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/githubNoE2ee/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/githubWithE2ee/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/play/google-services.json

      - name: Build App Bundle
        run: ./gradlew bundlePlayRelease
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-assets
          path: |
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/mapping/playRelease/mapping.txt

      - name: Detect Play Native Symbols
        id: play_symbols
        shell: bash
        run: |
          file="app/build/outputs/native-debug-symbols/playRelease/native-debug-symbols.zip"
          if [[ -f "$file" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Play Native Symbols Artifact
        if: steps.play_symbols.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: native-symbols-play
          path: ${{ steps.play_symbols.outputs.path }}

  release:
    name: Create Release
    needs: [build-github-apk, build-aab]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      HAS_GOOGLE_PLAY_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: apks-github
          path: artifacts/apks

      - uses: actions/download-artifact@v8
        with:
          name: bundle-assets
          path: artifacts/bundle

      - uses: actions/download-artifact@v8
        if: needs.build-aab.outputs.has_play_native_symbols == 'true'
        with:
          name: native-symbols-play
          path: artifacts/symbols-play

      - name: Parse release tag
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          eval "$(bash scripts/release_ref.sh parse-ref "${GITHUB_REF_TYPE}" "${GITHUB_REF_NAME}")"
          {
            echo "release_kind=$release_kind"
            echo "release_version=$release_version"
            echo "release_tag=$release_tag"
            echo "release_title<<EOF"
            echo "$release_title"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          release_name="${{ steps.release_meta.outputs.release_version }}"
          notes_file="release-notes.md"
          changelog_file="release-changelog.md"
          cat > "$notes_file" <<'EOF'
          <div align="center">
            <a href="https://play.google.com/store/apps/details?id=io.github.magisk317.xinyi.relay">
              <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" height="80"/>
            </a>
            <a href="https://github.com/magisk317/xinyi-relay/releases/tag/${{ steps.release_meta.outputs.release_tag }}">
              <img src="https://raw.githubusercontent.com/machiav3lli/oandbackupx/master/badge_github.png" alt="Get it on GitHub" height="80"/>
            </a>
          </div>
          EOF
          printf '\n' >> "$notes_file"
          awk -v version="$release_name" '
            $0 == "---" && found { exit }
            found { print; next }
            index($0, "## [" version "]") == 1 { found = 1; print; next }
            END { if (!found) exit 1 }
          ' docs/CHANGELOG.md > "$changelog_file"
          cat "$changelog_file" >> "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "ERROR: empty release notes for $release_name" >&2
            exit 1
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ steps.release_meta.outputs.release_tag }}"
          release_name="${{ steps.release_meta.outputs.release_title }}"
          notes_file="${{ steps.release_notes.outputs.notes_file }}"

          mapfile -d '' release_assets < <(
            find artifacts/apks artifacts/bundle -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z
          )
          if [[ ${#release_assets[@]} -eq 0 ]]; then
            echo "ERROR: no release assets found under artifacts/apks or artifacts/bundle" >&2
            find artifacts/apks artifacts/bundle -maxdepth 6 -type f | sort >&2 || true
            exit 1
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${release_assets[@]}" --clobber
            gh release edit "$tag_name" \
              --title "$release_name" \
              --draft=false \
              --notes-file "$notes_file"
          else
            gh release create "$tag_name" "${release_assets[@]}" \
              --title "$release_name" \
              --verify-tag \
              --notes-file "$notes_file"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}

      - name: Determine Release Track
        id: determine_track
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${{ steps.release_meta.outputs.release_tag }}"
          if [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "track=beta" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-alpha"* ]]; then
            echo "track=alpha" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-internal"* ]]; then
            echo "track=internal" >> $GITHUB_OUTPUT
          else
            echo "track=production" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Play Publish Inputs
        id: resolve_play
        shell: bash
        run: |
          aab_file=$(find artifacts/bundle -type f -name 'XinyiRelay_v*.aab' | sort | head -n 1)
          if [[ -z "$aab_file" ]]; then
            aab_file=$(find artifacts/bundle -type f -name '*.aab' | sort | head -n 1)
          fi
          if [[ -z "$aab_file" ]]; then
            echo "ERROR: no .aab found under artifacts/bundle" >&2
            find artifacts/bundle -maxdepth 4 -type f | sort >&2 || true
            exit 1
          fi

          mapping_file=$(find artifacts/bundle -type f -name mapping.txt | head -n 1 || true)
          symbols_file=$(find artifacts/symbols-play -type f -name native-debug-symbols.zip 2>/dev/null | head -n 1 || true)

          echo "aab_file=$aab_file" >> "$GITHUB_OUTPUT"
          if [[ -n "$mapping_file" ]]; then
            echo "has_mapping=true" >> "$GITHUB_OUTPUT"
            echo "mapping_file=$mapping_file" >> "$GITHUB_OUTPUT"
          else
            echo "mapping.txt not found under artifacts/bundle; skipping ProGuard mapping upload."
            echo "has_mapping=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$symbols_file" ]]; then
            echo "has_symbols=true" >> "$GITHUB_OUTPUT"
            echo "symbols_file=$symbols_file" >> "$GITHUB_OUTPUT"
          else
            echo "has_symbols=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby'

      - name: Install fastlane
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ruby --version
          gem --version
          gem_user_dir="$(ruby -r rubygems -e 'print Gem.user_dir')"
          echo "$gem_user_dir/bin" >> "$GITHUB_PATH"
          gem install --user-install fastlane --no-document

      - name: Publish to Google Play
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        shell: bash

        run: |
          set -euo pipefail

          cmd=(
            fastlane supply
            --aab "${{ steps.resolve_play.outputs.aab_file }}"
            --package_name "io.github.magisk317.xinyi.relay"
            --track "${{ steps.determine_track.outputs.track }}"
            --release_status "completed"
            --json_key_data "$ANDROID_PUBLISHER_CREDENTIALS"
            --skip_upload_metadata true
            --skip_upload_changelogs true
            --skip_upload_images true
            --skip_upload_screenshots true
          )

          if [[ "${{ steps.resolve_play.outputs.has_mapping }}" == "true" && "${{ steps.resolve_play.outputs.has_symbols }}" == "true" ]]; then
            cmd+=(--mapping_paths "${{ steps.resolve_play.outputs.mapping_file }},${{ steps.resolve_play.outputs.symbols_file }}")
          elif [[ "${{ steps.resolve_play.outputs.has_mapping }}" == "true" ]]; then
            cmd+=(--mapping "${{ steps.resolve_play.outputs.mapping_file }}")
          elif [[ "${{ steps.resolve_play.outputs.has_symbols }}" == "true" ]]; then
            cmd+=(--mapping_paths "${{ steps.resolve_play.outputs.symbols_file }}")
          fi

          "${cmd[@]}"
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_COLORS: '1'
          CI: 'true'

  publish-to-modules-repo:
    name: Publish to Xposed-Modules-Repo
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      HAS_MODULES_REPO_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN != '' }}
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      MODULES_REPO: Xposed-Modules-Repo/io.github.magisk317.xinyi.relay
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download APK Artifacts
        uses: actions/download-artifact@v8
        with:
          name: apks-github
          path: artifacts/apks

      - name: Parse release tag
        id: release_meta
        shell: bash
        run: |
          eval "$(bash scripts/release_ref.sh parse-ref "${GITHUB_REF_TYPE}" "${GITHUB_REF_NAME}")"
          {
            echo "release_kind=$release_kind"
            echo "release_tag=$release_tag"
            echo "release_version=$release_version"
            echo "release_title<<EOF"
            echo "$release_title"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          release_name="${{ steps.release_meta.outputs.release_version }}"
          notes_file="release-notes.md"
          changelog_file="release-changelog.md"
          cat > "$notes_file" <<'EOF'
          <div align="center">
            <a href="https://play.google.com/store/apps/details?id=io.github.magisk317.xinyi.relay">
              <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" height="80"/>
            </a>
            <a href="https://github.com/magisk317/xinyi-relay/releases/tag/${{ steps.release_meta.outputs.release_tag }}">
              <img src="https://raw.githubusercontent.com/machiav3lli/oandbackupx/master/badge_github.png" alt="Get it on GitHub" height="80"/>
            </a>
          </div>
          EOF
          printf '\n' >> "$notes_file"
          awk -v version="$release_name" '
            $0 == "---" && found { exit }
            found { print; next }
            index($0, "## [" version "]") == 1 { found = 1; print; next }
            END { if (!found) exit 1 }
          ' docs/CHANGELOG.md > "$changelog_file"
          cat "$changelog_file" >> "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "ERROR: empty release notes for $release_name" >&2
            exit 1
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish Release in Xposed-Modules-Repo
        if: env.HAS_MODULES_REPO_TOKEN == 'true' && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${{ steps.release_meta.outputs.release_version }}"
          release_name="${{ steps.release_meta.outputs.release_title }}"
          notes_file="${{ steps.release_notes.outputs.notes_file }}"

          mapfile -d '' apk_files < <(find artifacts/apks -type f -name '*.apk' -print0 | sort -z)
          if [[ ${#apk_files[@]} -eq 0 ]]; then
            echo "ERROR: no APK files found under artifacts/apks" >&2
            find artifacts/apks -maxdepth 6 -type f | sort >&2 || true
            exit 1
          fi
          if gh release view "$tag_name" --repo "${{ env.MODULES_REPO }}" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${apk_files[@]}" \
              --repo "${{ env.MODULES_REPO }}" \
              --clobber
            gh release edit "$tag_name" \
              --repo "${{ env.MODULES_REPO }}" \
              --title "$release_name" \
              --draft=false \
              --notes-file "$notes_file"
          else
            gh release create "$tag_name" \
              "${apk_files[@]}" \
              --repo "${{ env.MODULES_REPO }}" \
              --title "$release_name" \
              --notes-file "$notes_file"
          fi
        env:
          GH_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN }}
