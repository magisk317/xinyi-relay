# GitHub fallback for the Android release axis.
#
# GitLab owns releases: .gitlab-ci.yml runs the same scripts through
# .gitlab/ci/android-release.yml, gated by the $RELEASE_OWNER group variable.
# This file exists for the one situation where that chain cannot run at all --
# the GitLab runner fleet is down -- so a release can still be cut, published to
# the GitHub Release, submitted to Play, and pushed to Xposed-Modules-Repo.
#
# The publishing itself lives in the toolkit
# (magisk317/magisk-ci-toolkit/.github/workflows/release-android.yml,
# .gitlab-ci.yml pins it at the same SHA the GitLab pipeline includes), so the
# two hosts share one implementation instead of two that drift. See
# docs/hosting-cutover.md, "GitHub fallback release chain".
#
# This file replaces the in-repo chain that duplicated those ~600 lines here.
# Keep `name: Release` -- release-versioncode-recovery.yml fires on a completed
# run of the workflow called "Release", and that recovery path is this project's
# own (Play burns every versionCode it sees, so a collided code needs a bump PR).
# Note for the operator: that recovery workflow -- and every other workflow here
# except Release -- is disabled_manually on this repository, so a failed fallback
# release opens no bump PR by itself. Enable
# .github/workflows/release-versioncode-recovery.yml before relying on it, or run
# scripts/release/bump_version_code.sh and open the bump PR by hand.
#
# Deploying this file does not enable publishing. GitHub publishes only while the
# repository variable RELEASE_OWNER is exactly `github`:
#   Settings -> Secrets and variables -> Actions -> Repository variables
# That equality is deliberate -- sync:github force-pushes every GitLab release
# tag here, so an unset variable would make every mirrored tag a second publish
# from the mirror's own pushes.
#
# Emergency sequence -- the full procedure, including the recovery checklist, is
# docs/github-fallback-release.md in the toolkit. Short form:
#   1. scripts/release/release_tag.sh creates the signed annotated tag locally
#      (it sources the toolkit's release/release_tag.sh; no signing key exists
#      on GitHub and none is created here).
#   2. push the branch and the tag to github only. sync:github cannot run while
#      the fleet is down, so the mirror push is manual -- and pushing the tag to
#      GitLab now would queue a tag pipeline that publishes a second time as
#      soon as a runner returns. The tag goes back during recovery.
#   3. set RELEASE_OWNER=github on this repository.
#   4. Run workflow -> Release, tag name, publish switches as required.
#      Steps 3 and 4 are the only actions that produce external side effects, so
#      rehearse first with dry_run=true and RELEASE_OWNER left as `gitlab`: a dry
#      run builds and verifies and writes nothing outside the runner. It does not
#      need a tag that exists yet, because the guard compares the tag name with
#      versionName -- so the next version is a valid rehearsal target.
#   5. When GitLab runners are back, run the toolkit's
#      release/reconcile_github_refs.sh (read-only first, then --apply) and only
#      then set RELEASE_OWNER back, or the next sync:github force-push overwrites
#      whatever this chain published.
#
# What this chain does not cover, and why that is acceptable in an outage:
#   * Telegram. The release card is reviewed by a human before it goes out
#     (notification.yml stays workflow_dispatch only), so nothing here sends it.
#   * desktop:release:gitlab and the backend container images. They publish to a
#     GitLab release and to a registry, not to the GitHub Release, and both need
#     a Linux ARM runner; the Android artifact set -- what the app update channel
#     and Xposed-Modules-Repo consume -- is what has to keep working.
#
# Project-specific choices below:
#   * bun_manifest is deliberately left empty. frontend/webui is the relay's own
#     web UI, served by the Go backend (backend:go stages a webui_dist directory
#     into the container image); it is not an Android asset. `dist/` is
#     gitignored, no gradle file reads it, and GitLab's android:release:apk job
#     never installs Bun, so a Bun step here would be work the reference pipeline
#     does not do.
#   * google_services_paths mirrors the .xinyi_decode_google_services anchor. Note
#     one asymmetry: GitLab fails the job when GOOGLE_SERVICES_JSON is unset
#     (`:?` in the anchor), while the chain logs and continues. The secret is set
#     on this repository, and a rehearsal run is what proves the flavoured build
#     actually consumes it.
#   * keystore_path stays at the template default (repo-root release.jks), which
#     is what GitLab's android:release:apk writes. GitLab's hand-rolled
#     android:release:aab writes the same bytes to app/release.jks; both jobs
#     export KEYSTORE_FILE to wherever they put it, so the path is not an input
#     to the artifact.
name: Release

# Manual-only by policy (2026-10-25): automatic triggers are removed so this file
# can never start on its own. Release automation is driven from the project's
# primary CI host; runs on this mirror are operator-initiated, and the inputs
# below are the only way any publishing step turns on.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Signed release tag to publish (created locally with scripts/release/release_tag.sh)'
        required: true
        type: string
      publish_github_release:
        description: 'Create or update the GitHub Release'
        type: boolean
        default: true
      publish_play:
        description: 'Submit the Play bundle to Google Play'
        type: boolean
        default: true
      publish_modules_repo:
        description: 'Publish the channel tag to Xposed-Modules-Repo'
        type: boolean
        default: true
      dry_run:
        description: 'Build and verify only; no GitHub Release, Play or Xposed-Modules-Repo side effects'
        type: boolean
        default: false

permissions:
  contents: read

# A half-finished publish must never be cancelled out from under a re-run: the
# GitHub Release would exist without the Xposed-Modules-Repo channel tag, and the
# next run would upload into that mixture.
concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  # Decides, and says out loud why. A fallback workflow that silently produced an
  # empty green run is how a release gets "published" by nobody.
  release-eligibility:
    name: Check release ownership
    runs-on: ubuntu-26.04
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      publishes: ${{ steps.gate.outputs.publishes }}
    steps:
      - id: gate
        shell: bash
        env:
          OWNER: ${{ vars.RELEASE_OWNER }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          proceed=false
          publishes=false
          mode=''
          if [[ "$OWNER" == "github" ]]; then
            proceed=true
            if [[ "$DRY_RUN" == "true" ]]; then
              mode='dry run while RELEASE_OWNER=github'
            else
              publishes=true
              mode='publishing (RELEASE_OWNER=github)'
            fi
          elif [[ "$DRY_RUN" == "true" ]]; then
            # A rehearsal writes nothing outside the runner, so it is allowed
            # while GitLab still owns the release.
            proceed=true
            mode="dry run (RELEASE_OWNER=${OWNER:-unset})"
          else
            # Only a dispatch can reach this file, so arriving here means the
            # operator dispatched a publishing run without owning the release.
            echo "::error::GitHub is not the release owner (RELEASE_OWNER=${OWNER:-unset})."
            echo "   Either set RELEASE_OWNER=github on this repository to publish from here,"
            echo "   or re-run with dry_run checked to rehearse without side effects."
            exit 1
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "publishes=$publishes" >> "$GITHUB_OUTPUT"
          {
            echo "### Release eligibility"
            echo ""
            echo "- Event: \`$EVENT\`"
            echo "- RELEASE_OWNER: \`${OWNER:-unset}\`"
            echo "- Decision: **$mode**"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release (toolkit chain)
    needs: release-eligibility
    if: needs.release-eligibility.outputs.proceed == 'true'
    permissions:
      contents: write
    uses: magisk317/magisk-ci-toolkit/.github/workflows/release-android.yml@65505809acb199c24ae9e63df1975cdea2ab494b
    with:
      # Must equal the ref above, MAGISK_CI_TOOLKIT_REF and every GitLab
      # include.ref; ci/verify_toolkit_pin.sh in the toolkit checks it.
      toolkit_ref: 65505809acb199c24ae9e63df1975cdea2ab494b
      release_tag: ${{ inputs.release_tag }}
      package_name: io.github.magisk317.xinyi.relay
      release_cert_sha256: 027b936e1d82a606d83599548b8b11e49a2c8ae2588c4a9fbe8311e2c54f103a
      # The same project-specific values .gitlab-ci.yml passes to the GitLab
      # release templates, under the input names that mirror those variables.
      apk_tasks: :app:assembleGithubRelease
      gradle_extra_args: -PbuildSplits
      aab_tasks: :app:bundlePlayRelease
      play_track_override: production
      initial_version_code: '46'
      modules_repo: Xposed-Modules-Repo/io.github.magisk317.xinyi.relay
      play_url: https://play.google.com/store/apps/details?id=io.github.magisk317.xinyi.relay
      gitlab_project_url: https://gitlab.com/magisk3171/xinyi-relay
      google_services_paths: app/src/github app/src/play
      keystore_path: release.jks
      # github_repository is left at its default: the calling repository already
      # is magisk317/xinyi-relay, and the GitLab value exists only because that
      # pipeline runs somewhere else.
      #
      # MAGISK_ANDROID_RELEASE_GITHUB_ASSET_PATTERN is overridden to *.apk at job
      # level in .gitlab-ci.yml, because this app ships every ABI to the GitHub
      # Release; the toolkit default publishes only the arm64 artifact.
      github_asset_pattern: '*.apk'
      # GitLab's android:release:github attaches APKs only; the bundle goes to
      # Play, and the desktop archives go to a GitLab release instead.
      attach_aab: false
      # On a tag push every channel is on, exactly as the old chain behaved. On a
      # dispatch the operator picks; dry_run still turns all of them off inside
      # the chain.
      publish_github_release: ${{ inputs.publish_github_release }}
      publish_play: ${{ inputs.publish_play }}
      publish_modules_repo: ${{ inputs.publish_modules_repo }}
      dry_run: ${{ inputs.dry_run }}
      enabled: ${{ needs.release-eligibility.outputs.proceed == 'true' }}
      # Submodules are GitLab-hosted, so the chain needs GITLAB_TOKEN to check
      # them out; it arrives through `secrets: inherit`.
      checkout_submodules: recursive
    secrets: inherit
