name: Update Gradle Wrapper

on:
  schedule:
    - cron: '30 0 * * *' # Run daily at 00:30 UTC (08:30 Beijing time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: beta

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update Gradle Wrapper to Nightly
        run: ./gradlew wrapper --gradle-version nightly

      - name: Verify Build
        # Run basic checks to ensure the new wrapper doesn't break the build
        run: ./gradlew clean assembleDebug

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Check if there are changes to the wrapper files
          STATUS=$(git status --porcelain gradlew gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar)
          if [[ -n "$STATUS" ]]; then
            echo "Changes detected:"
            echo "$STATUS"

            # Extract version from gradle-wrapper.properties
            # Format: distributionUrl=.../gradle-9.5.0-20260212011320+0000-bin.zip -> 20260212011320
            VERSION=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-[0-9.]+-([0-9]+).*/\1/')
            if [[ -z "$VERSION" ]]; then
              VERSION="nightly"
            fi
            
            git add gradlew gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar
            git commit -m "build(wrapper): update gradle wrapper to nightly $VERSION"
            git pull origin beta --rebase
            git push origin beta
          else
            echo "No changes to commit"
            echo "Current distributionUrl:"
            grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties
          fi
