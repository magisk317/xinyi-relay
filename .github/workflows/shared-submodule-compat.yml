name: Shared Submodule Compat
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "build-logic/**"
      - "core/**"
      - "app/**"
      - "runtime/**"
      - "xpbridge-core/**"
      - "magisk-ui-kit/**"
      - "smscode-core/**"
      - "scripts/ci/resolve_package_toolchain.py"
      - "scripts/verify_shared_submodule_compat.sh"
  push:
    branches:
      - beta
    paths:
      - "build-logic/**"
      - "core/**"
      - "app/**"
      - "runtime/**"
      - "xpbridge-core/**"
      - "magisk-ui-kit/**"
      - "smscode-core/**"
      - "scripts/ci/resolve_package_toolchain.py"
      - "scripts/verify_shared_submodule_compat.sh"
  workflow_dispatch:

jobs:
  shared-compat:
    runs-on: ubuntu-latest
    env:
      HAS_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      SKIP_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON == '' }}
      ALLOW_INCOMPATIBLE_DEBUG_SIGNING: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve WebUI toolchain
        id: webui_toolchain
        shell: bash
        run: python scripts/ci/resolve_package_toolchain.py webui/package.json --require-node >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.webui_toolchain.outputs.node_version }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.webui_toolchain.outputs.pnpm_version }}
      - name: WebUI Install
        run: pnpm -C webui install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Decode Google Services
        if: env.HAS_GOOGLE_SERVICES_JSON == 'true'
        run: |
          mkdir -p app/src/github app/src/play
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/github/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/play/google-services.json
      - name: Verify shared submodule compatibility
        run: bash scripts/verify_shared_submodule_compat.sh
