name: Shared Submodule Compat
permissions:
  packages: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on: workflow_dispatch

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  shared-compat:
    runs-on: ubuntu-26.04
    env:
      HAS_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      SKIP_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON == '' }}
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
      - name: Set up Bun
        shell: bash
        run: bash .magisk-ci-toolkit/ci/ensure_bun.sh frontend/webui/package.json
      - name: WebUI Install
        run: bun -C frontend/webui install --frozen-lockfile --ignore-scripts
      - name: Decode Google Services
        if: env.HAS_GOOGLE_SERVICES_JSON == 'true'
        run: |
          mkdir -p app/src/github app/src/githubNoE2ee app/src/githubWithE2ee app/src/play
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/github/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/githubNoE2ee/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/githubWithE2ee/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/play/google-services.json
      - name: Verify shared submodule compatibility
        run: bash scripts/checks/verify_shared_submodule_compat.sh
