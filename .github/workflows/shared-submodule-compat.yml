name: Shared Submodule Compat
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "build-logic/**"
      - "core/**"
      - "app/**"
      - "runtime/**"
      - "webui-core/**"
      - "xpbridge-core/**"
      - "magisk-ui-kit/**"
      - "smscode-core/**"
      - "scripts/verify_shared_submodule_compat.sh"
  push:
    branches:
      - beta
    paths:
      - "build-logic/**"
      - "core/**"
      - "app/**"
      - "runtime/**"
      - "webui-core/**"
      - "xpbridge-core/**"
      - "magisk-ui-kit/**"
      - "smscode-core/**"
      - "scripts/verify_shared_submodule_compat.sh"

jobs:
  shared-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: magisk317/XposedSmsCode
          path: sibling-xposed-smscode
          submodules: recursive
          fetch-depth: 0
      - name: Resolve WebUI toolchain
        id: webui_toolchain
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          package_json = json.loads(Path("webui/package.json").read_text())
          node_version = package_json.get("engines", {}).get("node")
          package_manager = package_json.get("packageManager", "")
          if not node_version:
              raise SystemExit("webui/package.json is missing engines.node")
          if not package_manager.startswith("pnpm@"):
              raise SystemExit("webui/package.json must declare packageManager as pnpm@<version>")
          print(f"node_version={node_version}")
          print(f"pnpm_version={package_manager.split('@', 1)[1]}")
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.webui_toolchain.outputs.node_version }}
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.webui_toolchain.outputs.pnpm_version }}
      - name: WebUI Install
        run: pnpm -C webui install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Verify shared submodule compatibility
        run: bash scripts/verify_shared_submodule_compat.sh "$GITHUB_WORKSPACE/sibling-xposed-smscode"
