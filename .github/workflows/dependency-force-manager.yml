name: Dependency Force Manager

on:
  schedule:
    - cron: "30 2 * * *" # Daily 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: read

jobs:
  dependency-force:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: beta

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Read current forced dependencies
        id: forced
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          import tomllib

          build_path = Path("build.gradle.kts")
          toml_path = Path("gradle/libs.versions.toml")
          libs = tomllib.loads(toml_path.read_text())
          versions = libs.get("versions", {})
          libraries = libs.get("libraries", {})

          def resolve_alias(alias: str):
            lib = libraries.get(alias)
            if not lib:
              return None
            module = lib.get("module")
            version_ref = lib.get("version", {}).get("ref")
            version = versions.get(version_ref) if version_ref else None
            if module and version:
              group, artifact = module.split(":", 1)
              return {"group": group, "artifact": artifact, "version": version}
            return None

          forces = []
          for line in build_path.read_text().splitlines():
            m = re.search(r"force\\((.+)\\)", line)
            if not m:
              continue
            expr = m.group(1).strip()
            if expr.startswith("catalog."):
              alias = expr.replace("catalog.", "").strip()
              resolved = resolve_alias(alias)
              if resolved:
                forces.append({**resolved, "line": line})
            elif expr.startswith("\"") or expr.startswith("'"):
              coord = expr.strip("\"'")
              parts = coord.split(":")
              if len(parts) >= 3:
                group = parts[0]
                artifact = parts[1]
                version = ":".join(parts[2:])
                forces.append({"group": group, "artifact": artifact, "version": version, "line": line})

          Path("/tmp/forced.json").write_text(json.dumps(forces, indent=2))
          print(f"Forced entries: {len(forces)}")
          PY

      - name: Temporarily remove all force rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build.gradle.kts")
          original = path.read_text()
          lines = original.splitlines()
          new_lines = [line for line in lines if "force(" not in line]
          path.write_text("\n".join(new_lines) + ("\n" if original.endswith("\n") else ""))
          PY

      - name: Resolve natural versions (multi-variant)
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          configs = [
            "githubDebugRuntimeClasspath",
            "playDebugRuntimeClasspath",
            "fdroidDebugRuntimeClasspath",
          ]
          forced = json.loads(Path("/tmp/forced.json").read_text())
          results = {}
          for item in forced:
            group = item["group"]
            artifact = item["artifact"]
            dep = f"{group}:{artifact}"
            results[dep] = {}
            for config in configs:
              print(f"Resolving {dep} in {config}...")
              cmd = [
                "./gradlew",
                ":app:dependencyInsight",
                "--dependency", dep,
                "--configuration", config,
                "--console=plain",
              ]
              proc = subprocess.run(cmd, capture_output=True, text=True, check=False)
              text = proc.stdout + "\n" + proc.stderr
              match = re.search(rf"{re.escape(group)}:{re.escape(artifact)}:([\\w\\.-]+)", text)
              resolved = match.group(1) if match else ""
              results[dep][config] = resolved
              if not resolved:
                print(f"  WARN: no resolved version found for {dep} in {config}")
          Path("/tmp/natural.json").write_text(json.dumps(results, indent=2))
          PY

      - name: Restore original build file
        run: git checkout -- build.gradle.kts

      - name: Determine removable forces
        id: removable
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          forced = json.loads(Path("/tmp/forced.json").read_text())
          natural = json.loads(Path("/tmp/natural.json").read_text())
          removable = []
          for item in forced:
            dep = f"{item['group']}:{item['artifact']}"
            resolved_by_config = natural.get(dep, {})
            if not resolved_by_config:
              continue
            resolved_versions = [v for v in resolved_by_config.values() if v]
            if len(resolved_versions) != len(resolved_by_config):
              continue
            if all(v == item["version"] for v in resolved_versions):
              removable.append(dep)

          Path("/tmp/removable.json").write_text(json.dumps(removable, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"count={len(removable)}\\n")
          print(f"Removable forces: {len(removable)}")
          PY

      - name: Fetch Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            > /tmp/dependabot-alerts.json

      - name: Apply updates (remove + add security forces)
        id: apply
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          import tomllib

          build_path = Path("build.gradle.kts")
          text = build_path.read_text().splitlines()

          removable = set(json.loads(Path("/tmp/removable.json").read_text()))

          libs = tomllib.loads(Path("gradle/libs.versions.toml").read_text())
          versions = libs.get("versions", {})
          libraries = libs.get("libraries", {})

          def resolve_alias(alias: str):
            lib = libraries.get(alias)
            if not lib:
              return None
            module = lib.get("module")
            version_ref = lib.get("version", {}).get("ref")
            version = versions.get(version_ref) if version_ref else None
            if module and version:
              group, artifact = module.split(":", 1)
              return f"{group}:{artifact}", version
            return None

          # Remove forced lines for dependencies that are now naturally resolved
          filtered = []
          for line in text:
            m = re.search(r"force\\((.+)\\)", line)
            if not m:
              filtered.append(line)
              continue
            expr = m.group(1).strip().strip("\"'")
            if expr.startswith("catalog."):
              alias = expr.replace("catalog.", "").strip()
              resolved = resolve_alias(alias)
              if resolved:
                dep, _version = resolved
                if dep in removable:
                  continue
            elif ":" in expr:
              parts = expr.split(":")
              dep = f"{parts[0]}:{parts[1]}"
              if dep in removable:
                continue
            filtered.append(line)

          # Build security force list from Dependabot alerts
          alerts = json.loads(Path("/tmp/dependabot-alerts.json").read_text())
          security_forces = {}
          for alert in alerts:
            dep = alert.get("dependency", {}).get("package", {}).get("name")
            patched = alert.get("security_vulnerability", {}).get("first_patched_version", {}) or {}
            target = patched.get("identifier") or patched.get("version")
            if dep and target:
              security_forces[dep] = target

          # Update auto-force block
          begin = "            // BEGIN AUTO FORCED DEPENDENCIES (managed by workflow)"
          end = "            // END AUTO FORCED DEPENDENCIES (managed by workflow)"
          try:
            start = filtered.index(begin)
            stop = filtered.index(end)
          except ValueError:
            raise SystemExit("Auto force block not found in build.gradle.kts")

          block_lines = [begin]
          for dep in sorted(security_forces):
            block_lines.append(f"            force(\"{dep}:{security_forces[dep]}\")")
          block_lines.append(end)

          new_text = filtered[:start] + block_lines + filtered[stop + 1 :]
          build_path.write_text("\n".join(new_text) + "\n")
          PY

      - name: Create PR with dependency force updates
        uses: peter-evans/create-pull-request@v8
        with:
          base: beta
          branch: chore/dependency-force-update
          delete-branch: true
          title: "build: update forced dependencies"
          commit-message: "build: update forced dependencies"
          body: |
            Automated dependency force maintenance:
            - Removed force rules when natural resolution already matches forced versions.
            - Added or updated force rules for dependencies with open security alerts (Dependabot).
