name: Dependency Security Manager

on:
  schedule:
    - cron: "30 2 * * *" # Daily 02:30 UTC
  push:
    branches:
      - beta
  pull_request_target:
    branches:
      - beta
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: read

jobs:
  dependency-security:
    name: Attempt dependency security remediation
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: dependency-security-manager-${{ github.ref }}
      cancel-in-progress: false
    if: |
      !(
        github.event_name == 'push' &&
        github.ref == 'refs/heads/beta' &&
        startsWith(github.event.head_commit.message, 'Merge pull request #') &&
        (
          contains(github.event.head_commit.message, 'from magisk317/chore/dependency-force-update') ||
          contains(github.event.head_commit.message, 'from magisk317/janitor/security-fixes')
        )
      ) &&
      !(
        github.event_name == 'pull_request_target' &&
        (
          github.event.pull_request.head.ref == 'chore/dependency-force-update' ||
          github.event.pull_request.head.ref == 'janitor/security-fixes'
        )
      )
    env:
      DEPENDENCY_FORCE_CONFIGS: githubDebugRuntimeClasspath,playDebugRuntimeClasspath,githubReleaseRuntimeClasspath,playReleaseRuntimeClasspath
      DEPENDENCY_FORCE_HISTORICAL_ALERT_COOLDOWN_HOURS: 168
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: beta

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: "26"
          distribution: "temurin"
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Run security janitor
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          bash scripts/janitor_security_fixes.sh

      - name: Report alert coverage
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          bash scripts/reconcile_dependabot_alerts.sh

      - name: Create PR with dependency security updates
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          base: beta
          branch: janitor/security-fixes
          delete-branch: true
          title: "chore(security): apply automated dependency security fixes"
          commit-message: "chore(security): apply automated dependency security fixes"
          labels: |
            dependencies
            java
            rust
            security
          body: |
            Automated dependency security fix run.
            - Updates Gradle force rules for open Maven Dependabot alerts.
            - Updates Cargo lockfiles for open Rust Dependabot alerts when the patched version is selectable.
            - Reports remaining alerts that require upstream dependency movement.

      - name: Write remediation summary
        if: always()
        run: |
          {
            echo "## Dependency security remediation"
            echo ""
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Base ref: ${{ github.base_ref || github.ref_name }}"
            echo "- Auto PR operation: ${{ steps.cpr.outputs.pull-request-operation || 'none' }}"
            echo "- Auto PR number: ${{ steps.cpr.outputs.pull-request-number || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"
