name: Release Retry Retag

# Manual-only by policy (2026-10-25): automatic triggers are removed so this file
# can never start on its own. Release automation is driven from the project's
# primary CI host; runs on this mirror are operator-initiated, and the inputs
# below are the only way any publishing step turns on.
on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Operator note recorded with the run (this file has no automatic trigger anymore)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  retag-release:
    runs-on: ubuntu-26.04
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'chore/release-versioncode-')
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Delete old tag and push replacement
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${{ github.event.pull_request.head.ref }}"
          tag_name="${tag_name#chore/release-versioncode-}"

          remote_output="$(git ls-remote --tags origin "refs/tags/$tag_name")"
          if [[ -n "$remote_output" ]]; then
            git push origin ":refs/tags/$tag_name"
          fi

          if git rev-parse -q --verify "refs/tags/$tag_name" >/dev/null; then
            git tag -d "$tag_name"
          fi

          git tag -a "$tag_name" -m "$tag_name"
          git push origin "$tag_name"
