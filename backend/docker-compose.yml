# Compose 项目名，用于固定网络名和资源名前缀
name: relay-backend

services:
  # PostgreSQL：负责保存用户、设备、配置快照和记录数据
  postgres:
    # 固定容器名，方便 docker ps / logs / exec
    container_name: relay-backend-postgres
    # 官方 PostgreSQL Alpine 镜像
    image: postgres:18.6-alpine3.23
    # 容器异常退出后自动拉起；手动 docker stop 不会强制重启
    restart: unless-stopped
    # 从 .env 读取数据库相关变量
    env_file:
      - .env
    environment:
      # 初始化数据库名
      POSTGRES_DB: ${POSTGRES_DB}
      # 初始化数据库用户
      POSTGRES_USER: ${POSTGRES_USER}
      # 初始化数据库密码
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+ 需要挂到上层目录，数据会落在其版本化子目录中
      - ${RELAY_POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql
    ports:
      # 仅暴露 PostgreSQL 到本机，便于本地调试和手工连接
      - "127.0.0.1:5432:5432"

  # Go API：提供认证、设备管理、配置同步、记录查询等后端接口
  api:
    # 固定容器名，方便 docker ps / logs / exec
    container_name: relay-backend-api
    # 默认直接拉取 Docker Hub 上发布好的后端镜像
    image: ${RELAY_API_IMAGE:-docker.io/alpha317/xinyi-relay-backend:beta}
    # 默认优先拉取远端 beta 镜像；本地烟测可用 never 覆盖
    pull_policy: ${RELAY_API_PULL_POLICY:-always}
    # 容器异常退出后自动拉起；手动 docker stop 不会强制重启
    restart: unless-stopped
    # 从 .env 读取运行时配置
    env_file:
      - .env
    environment:
      # 后端运行环境标识
      RELAY_APP_ENV: ${RELAY_APP_ENV}
      # API 容器监听地址
      RELAY_HTTP_ADDR: ${RELAY_HTTP_ADDR}
      # 本地优先访问地址
      RELAY_LOCAL_BASE_URL: ${RELAY_LOCAL_BASE_URL}
      # 可选公网访问地址
      RELAY_PUBLIC_BASE_URL: ${RELAY_PUBLIC_BASE_URL}
      # 允许跨域的前端来源
      RELAY_CORS_ORIGIN: ${RELAY_CORS_ORIGIN}
      # 连接 PostgreSQL 的 DSN
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL}
      # 日志文件路径（容器内路径）
      RELAY_LOG_FILE: ${RELAY_LOG_FILE:-/var/log/relay/backend.log}
      # 日志级别
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
    volumes:
      # 持久化后端日志
      - ${RELAY_LOG_DIR:-./logs}:/var/log/relay
    ports:
      # 由于前后端已打包到一起，直接暴露 API 端口供本地或反代使用
      - "8088:8080"
    depends_on:
      # API 依赖数据库容器先启动
      - postgres
